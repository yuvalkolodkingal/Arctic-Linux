# Packages Get apps never removes (Remove apps, its launcher Delete key and the console's
# typed `dnf remove`): one fnmatch pattern per line. Removing any of these would break the
# desktop or the system, and a removal that would take one of them along is refused as a whole.
# Administrators add their own patterns in /etc/arctic/protected-packages.d/*.conf.
# Families whose every member is system-critical are globs; everything else is an exact name.
# (dnf itself isn't told: `sudo dnf remove` in a terminal still works for experts.)

