[General]
# Wallpaper behind the login card (relative to this directory or absolute).
background=background.png
# "polar-night" (default on the login screen) or "winter".
colorScheme=polar-night
# true removes the error shake and other movement (brand: reduced motion).
reduceMotion=false
# Qt date/time formats for the clock block.
timeFormat=HH:mm
dateFormat=dddd, d MMMM
# Shown next to the keyboard icon when SDDM cannot report the layout (always
# the case on Wayland). The installer writes the chosen layout here through
# theme.conf.user, e.g. keyboardLayout=us
keyboardLayout=
