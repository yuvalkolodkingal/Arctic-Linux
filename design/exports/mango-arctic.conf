# Arctic Linux — Mango (tiling Wayland compositor) look. Source from ~/.config/mango/config.conf
# Colours are 0xRRGGBBAA. Polar night shown; Winter values in comments.

borderpx=2
border_radius=10
gappih=8
gappiv=8
gappoh=8
gappov=8
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
shadows=0

rootcolor=0x12171eff        # Winter 0xeef2f5ff  (ground)
bordercolor=0x2f3945ff      # Winter 0xd5dde4ff  (line)
focuscolor=0xf6bd55ff       # Winter 0xa86812ff  (accent-edge)
urgentcolor=0xff9189ff      # Winter 0xb3261eff  (error)
maxmizescreencolor=0x2f3945ff
scratchpadcolor=0x6b7a8aff  # line-strong
globalcolor=0x86bdf5ff      # info
overlaycolor=0x3a2d16ff     # accent-soft

# Motion: duration-base 180ms, ease-standard cubic-bezier(0.2,0,0,1)
animations=1
animation_duration_move=180
animation_duration_open=180
animation_duration_tag=180
animation_duration_close=120
animation_curve_move=0.2,0,0,1
animation_curve_open=0,0,0.2,1
animation_curve_close=0.4,0,1,1
# Reduced motion: set animations=0 (the Settings > Accessibility switch writes this).

# Keys (the whole desktop is keyboard-first)
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn,arctic-launcher
bind=SUPER,i,spawn,arctic-installer     # live session only
bind=SUPER,l,spawn,arctic-lock
