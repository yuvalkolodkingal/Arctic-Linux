# CI profile: the default install (encrypted, whole disk) with no internet, as in
# tools/test-install.sh. The apps come from the live image where the catalog has one (kitty,
# zsh, Thunar, VLC); Zen (the browser is required) and Zed have to be downloaded, so offline
# they fail, are retried once and are deferred to /var/lib/arctic/pending.json together with
# the media codecs (arctic-firstboot installs them once the machine is online).
# The harness passes ARCTIC_LUKS_PASSPHRASE and ARCTIC_USER_PASSWORD and types the
# passphrase at boot.

description = "CI: offline install on a blank disk, encrypted, downloads deferred"

[welcome]
language = "en_US.UTF-8"

[keyboard]
layout = "us"
variant = ""

[timezone]
timezone = "UTC"
auto_time = true

[disk]
disk = ""
mode = "erase"

[encryption]
enabled = true

[account]
full_name = "Arctic CI"
username = "ci"
hostname = "arctic-ci"
autologin = false

[apps]
browser = ["zen"]
editor = ["zed"]
terminal = ["kitty"]
shell = ["zsh"]
files = ["thunar"]
office = []
video = ["vlc"]
extras = []
