name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOFLAGS: -mod=mod
      CGO_ENABLED: "0"
    steps:
      - name: Install tools
        run: dnf -y install git golang
      - uses: actions/checkout@v4
      - name: go vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f go.mod ]; then echo "no go.mod yet"; exit 0; fi
          [ -d vendor ] && export GOFLAGS=-mod=vendor
          go vet ./...
      - name: go test
        run: |
          if [ ! -f go.mod ]; then exit 0; fi
          [ -d vendor ] && export GOFLAGS=-mod=vendor
          go test ./...

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git ShellCheck file
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          files=()
          for f in dotfiles/.local/bin/* tools/*.sh tools/lib/*.sh live/* iso/kiwi/config.sh \
                   packaging/sddm-wayland-mango/sddm-compositor-mango packaging/desktop/*.sh packaging/desktop/arctic-share-picker \
                   packaging/updates/*.sh packaging/theme-hooks.d/* dotfiles/.bashrc.d/*.sh settings/dev/*.sh; do
            [ -f "$f" ] || continue
            case "$(head -n1 "$f")" in
              *python*|*node*) continue ;;
            esac
            case "$f" in *.conf) continue ;; esac
            files+=("$f")
          done
          printf '%s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

  shell-tests:
    name: Shell tests (Python, Node)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        # zsh, fzf, foot and fastfetch let the app theme tests run the apps' own checks (zsh -n,
        # fzf's option parser, foot --check-config, fastfetch with the Arctic layouts); without
        # them those checks are skipped.
        run: dnf -y install git python3 python3-pyte python3-pillow python3-rpm nodejs librsvg2-tools util-linux procps-ng zsh fzf foot fastfetch
      - uses: actions/checkout@v4
      - name: Python unittest (design/themegen — theme engine, wallpaper colours, arctic-theme, app templates and theme hooks)
        run: python3 -m unittest discover -s design/themegen/tests -v
      - name: Python unittest (shell/tests)
        run: |
          if ls shell/tests/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s shell/tests -p 'test_*.py' -v
          fi
      - name: Python unittest (tools/tests, the repository publishing helpers)
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Python unittest (packaging/firstboot)
        run: python3 -m unittest discover -s packaging/firstboot -p 'test_*.py' -v
      - name: Python unittest (packaging/updates, arctic-update)
        run: python3 -m unittest discover -s packaging/updates -p 'test_*.py' -v
      - name: Python unittest (settings/tests)
        run: python3 -m unittest discover -s settings/tests -p 'test_*.py' -v
      - name: Node tests (shell/tests)
        run: |
          for t in shell/tests/*.cjs shell/tests/*.mjs shell/tests/*.js; do
            [ -f "$t" ] || continue
            echo "== $t"
            node "$t"
          done

  units:
    name: systemd units (arctic-update)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git systemd python3
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          # ExecStart= must exist for verify: install the command where the package puts it.
          install -m 0755 dotfiles/.local/bin/arctic-update /usr/bin/arctic-update
          # --man=no: the container has no man pages (tsflags=nodocs), so the
          # Documentation=man: check would fail although the page ships with dnf5.
          systemd-analyze verify --man=no packaging/systemd/arctic-update-stage.service \
            packaging/systemd/arctic-update-stage.timer packaging/systemd/arctic-update-restage.timer

  dnf5-offline:
    name: dnf5 offline updates (arctic-update, real dnf5)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git dnf5-plugins libdnf5-plugin-actions rpm-build createrepo_c python3 util-linux
      - uses: actions/checkout@v4
      - name: packaging/updates/test-dnf5-offline.sh
        # Downloads, schedules, installs (dnf5 offline _execute) and fails updates with a local
        # repository, and pins the dnf5 behaviour and messages arctic-update relies on.
        run: packaging/updates/test-dnf5-offline.sh

  qml:
    name: qmllint
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git qt6-qtdeclarative-devel quickshell sddm
      - uses: actions/checkout@v4
      - name: qmllint (syntax errors fail; warnings are reported)
        run: |
          rc=0
          for d in shell installer-ui settings branding/sddm/arctic; do
            [ -d "$d" ] || continue
            mapfile -t qml < <(find "$d" -name '*.qml' | sort)
            [ ${#qml[@]} -gt 0 ] || continue
            echo "::group::$d (${#qml[@]} files)"
            (cd "$d" && /usr/lib64/qt6/bin/qmllint -I . "${qml[@]#"$d"/}") || rc=1
            echo "::endgroup::"
          done
          exit $rc

  settings-headless:
    name: Settings app (headless smoke test)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: |
          dnf -y install git quickshell qt6-qtsvg qt6-qtwayland sway grim python3 python3-pillow \
            librsvg2-tools dbus-daemon swaybg wlr-randr fontconfig google-noto-sans-fonts procps-ng \
            pipewire wireplumber pipewire-utils libcap findutils which
      - uses: actions/checkout@v4
      - name: Every page loads without QML errors, a change reaches settings.conf
        run: settings/dev/headless.sh --smoke --fixtures --out /tmp/settings-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshots
          path: /tmp/settings-shots/*.png
          retention-days: 7

  specs:
    name: RPM specs parse
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git rpm-build systemd-rpm-macros selinux-policy-devel
      - uses: actions/checkout@v4
      - name: rpmspec
        run: |
          for s in packaging/*.spec; do
            echo "== $s"
            rpmspec -q --qf '%{name}-%{version}-%{release}.%{arch}\n' "$s"
          done

  rpms:
    name: Build RPMs (tools/build-rpms.sh)
    runs-on: ubuntu-latest
    needs: [specs]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          # Empty in forks and pull requests from them: arctic-release then ships the Arctic
          # repositories disabled (tools/build-rpms.sh warns).
          ARCTIC_GPG_PUBLIC_KEY: ${{ secrets.ARCTIC_GPG_PUBLIC_KEY }}
        run: |
          tools/build-rpms.sh
          cat out/BUILD-INFO
      - name: Repository (unsigned test publish, dnf5 checks)
        run: |
          tools/publish-repo.sh --no-sign --site out/site --channel testing
          tools/publish-repo.sh --no-sign --site out/site --channel stable
          tools/test-repo.sh --rpms out/repo --site out/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpms
          path: |
            out/repo/*.rpm
            out/BUILD-INFO
            out/logs/
          retention-days: 7
