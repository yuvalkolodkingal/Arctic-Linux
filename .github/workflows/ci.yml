name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOFLAGS: -mod=mod
      CGO_ENABLED: "0"
    steps:
      - name: Install tools
        run: dnf -y install git golang
      - uses: actions/checkout@v4
      - name: go vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f go.mod ]; then echo "no go.mod yet"; exit 0; fi
          [ -d vendor ] && export GOFLAGS=-mod=vendor
          go vet ./...
      - name: go test
        run: |
          if [ ! -f go.mod ]; then exit 0; fi
          [ -d vendor ] && export GOFLAGS=-mod=vendor
          go test ./...

  # Stream 1 (web apps): the cgo WebKitGTK 6.0 window, its tagged tests and a headless smoke
  # test in sway (docs/BUILD-SPEC.md §11). The go job above covers every pure-Go web-app package.
  go-webkit:
    name: Go (web app host, cgo WebKitGTK 6.0)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOFLAGS: -mod=mod
      CGO_ENABLED: "1"
    steps:
      - name: Install tools
        run: |
          dnf -y install git golang gcc binutils webkitgtk6.0-devel gtk4-devel libsoup3-devel \
            publicsuffix-list librsvg2-tools desktop-file-utils sway grim dbus-daemon dbus-tools \
            mesa-dri-drivers fontconfig google-noto-sans-fonts procps-ng python3 python3-gobject playerctl wtype wl-clipboard libcap
      - uses: actions/checkout@v4
      - name: go vet (tagged), web-app tests, host build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet -tags webkit ./...
          go test -tags webkit ./internal/webapp/... ./internal/webkit/... ./cmd/arctic-webapp/... ./cmd/arctic-webapp-host/...
          go build -tags webkit -o /tmp/arctic-webapp-host ./cmd/arctic-webapp-host
          readelf -d /tmp/arctic-webapp-host | grep -q 'NEEDED.*libwebkitgtk-6\.0\.so\.4'
          CGO_ENABLED=0 go build -o /tmp/arctic-webapp ./cmd/arctic-webapp
          if readelf -d /tmp/arctic-webapp | grep -q NEEDED; then echo "arctic-webapp must not link libraries"; exit 1; fi
          /tmp/arctic-webapp render-sample /tmp/webapp-sample
          desktop-file-validate /tmp/webapp-sample/*.desktop
      - name: Headless smoke test (sandbox off only here; bwrap can't create namespaces in this container)
        run: cmd/arctic-webapp-host/dev/smoke.sh --out /tmp/webapp-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webapp-screenshots
          path: /tmp/webapp-shots/*.png
          retention-days: 7

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git ShellCheck file fish
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          files=()
          for f in dotfiles/.local/bin/* tools/*.sh tools/lib/*.sh live/* iso/kiwi/config.sh \
                   packaging/sddm-wayland-mango/sddm-compositor-mango packaging/desktop/*.sh packaging/desktop/arctic-share-picker \
                   packaging/updates/*.sh packaging/theme-hooks.d/* dotfiles/.bashrc.d/*.sh settings/dev/*.sh \
                   cmd/arctic-webapp-host/dev/*.sh; do
            [ -f "$f" ] || continue
            case "$(head -n1 "$f")" in
              *python*|*node*) continue ;;
            esac
            case "$f" in *.conf) continue ;; esac
            files+=("$f")
          done
          printf '%s\n' "${files[@]}"
          shellcheck -x "${files[@]}"
          fish --no-execute dotfiles/.config/fish/config.fish

  fetch-c:
    name: fetch.c builds and runs (arctic-fetch-3d)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git gcc make file
      - uses: actions/checkout@v4
      # The vendored greeting is only compiled by the RPM build, which runs late and only in one
      # job: a C error would otherwise reach main unnoticed. Nothing here needs more than a
      # compiler and libm.
      - name: make
        run: make -C fetch
      - name: it runs, and every field gathers
        run: |
          file fetch/arctic-fetch-3d
          fetch/arctic-fetch-3d --version
          fetch/arctic-fetch-3d --help | grep -q 'Usage: arctic-fetch-3d'
          # One still frame with every field of the system config: this walks all the gather_*
          # functions, so a crash in any of them fails here.
          mkdir -p /tmp/fetch-home/.config/arctic/fetch
          cp fetch/config /tmp/fetch-home/.config/arctic/fetch/config
          HOME=/tmp/fetch-home XDG_CONFIG_HOME=/tmp/fetch-home/.config \
            fetch/arctic-fetch-3d --frames 1 > /tmp/fetch.out
          # The two fields Arctic added most recently, and the colour swatches the last field draws.
          grep -aq 'Base' /tmp/fetch.out
          grep -aqP '\x1b\[40m' /tmp/fetch.out

  shell-tests:
    name: Shell tests (Python, Node)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        # zsh, fzf, foot and fastfetch let the app theme tests run the apps' own checks (zsh -n,
        # fzf's option parser, foot --check-config, fastfetch with the Arctic layouts); without
        # them those checks are skipped. python3-dbus, python3-dbusmock and dbus-daemon run the
        # Bluetooth agent against a mock BlueZ; glibc-langpack-en lets arctic-update's Flatpak count
        # test run in a non-C locale.
        run: dnf -y install git python3 python3-pyte python3-pillow python3-rpm nodejs librsvg2-tools util-linux procps-ng zsh fzf foot fastfetch python3-dbus python3-gobject-base python3-dbusmock dbus-daemon glibc-langpack-en
      - uses: actions/checkout@v4
      - name: Python unittest (design/themegen — theme engine, wallpaper colours, arctic-theme, app templates and theme hooks)
        run: python3 -m unittest discover -s design/themegen/tests -v
      - name: Python unittest (shell/tests)
        run: |
          if ls shell/tests/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s shell/tests -p 'test_*.py' -v
          fi
      - name: Python unittest (tools/tests, the repository publishing helpers)
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Python unittest (packaging/firstboot)
        run: python3 -m unittest discover -s packaging/firstboot -p 'test_*.py' -v
      - name: Python unittest (packaging/updates, arctic-update)
        run: python3 -m unittest discover -s packaging/updates -p 'test_*.py' -v
      - name: Python unittest (settings/tests)
        run: python3 -m unittest discover -s settings/tests -p 'test_*.py' -v
      - name: Node tests (shell/tests)
        run: |
          for t in shell/tests/*.cjs shell/tests/*.mjs shell/tests/*.js; do
            [ -f "$t" ] || continue
            echo "== $t"
            node "$t"
          done

  units:
    name: systemd units (arctic-update)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git systemd python3
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          # ExecStart= must exist for verify: install the command where the package puts it.
          install -m 0755 dotfiles/.local/bin/arctic-update /usr/bin/arctic-update
          # --man=no: the container has no man pages (tsflags=nodocs), so the
          # Documentation=man: check would fail although the page ships with dnf5.
          systemd-analyze verify --man=no packaging/systemd/arctic-update-stage.service \
            packaging/systemd/arctic-update-stage.timer packaging/systemd/arctic-update-restage.timer \
            packaging/systemd/arctic-flatpak-update.service packaging/systemd/arctic-flatpak-update.timer
          XDG_RUNTIME_DIR="$(mktemp -d)" systemd-analyze verify --user --man=no \
            packaging/systemd/user/arctic-flatpak-update.service \
            packaging/systemd/user/arctic-flatpak-update.timer

  dnf5-offline:
    name: dnf5 offline updates (arctic-update, real dnf5)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git dnf5-plugins libdnf5-plugin-actions rpm-build createrepo_c python3 util-linux
      - uses: actions/checkout@v4
      - name: packaging/updates/test-dnf5-offline.sh
        # Downloads, schedules, installs (dnf5 offline _execute) and fails updates with a local
        # repository, and pins the dnf5 behaviour and messages arctic-update relies on.
        run: packaging/updates/test-dnf5-offline.sh

  dnf5-remove:
    name: dnf5 remove previews (Remove apps, real dnf5)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git dnf5-plugins rpm-build createrepo_c python3 python3-pyte util-linux
      - uses: actions/checkout@v4
      - name: shell/tests/test-dnf5-remove.sh
        # Previews removals as a normal user (dnf5 remove --store), pins the transaction reasons
        # and repoquery fields shell/scripts/apps.py reads, and removes what the preview listed.
        run: shell/tests/test-dnf5-remove.sh

  qml:
    name: qmllint
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git qt6-qtdeclarative-devel quickshell sddm
      - uses: actions/checkout@v4
      - name: qmllint (syntax errors fail; warnings are reported)
        run: |
          rc=0
          for d in shell installer-ui settings branding/sddm/arctic; do
            [ -d "$d" ] || continue
            mapfile -t qml < <(find "$d" -name '*.qml' | sort)
            [ ${#qml[@]} -gt 0 ] || continue
            echo "::group::$d (${#qml[@]} files)"
            (cd "$d" && /usr/lib64/qt6/bin/qmllint -I . "${qml[@]#"$d"/}") || rc=1
            echo "::endgroup::"
          done
          exit $rc

  settings-headless:
    name: Settings app (headless smoke test)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: |
          dnf -y install git quickshell qt6-qtsvg qt6-qtwayland sway grim python3 python3-pillow \
            librsvg2-tools dbus-daemon swaybg wlr-randr fontconfig google-noto-sans-fonts procps-ng \
            pipewire wireplumber pipewire-utils libcap findutils which
      - uses: actions/checkout@v4
      - name: Every page loads without QML errors, a change reaches settings.conf
        run: settings/dev/headless.sh --smoke --fixtures --out /tmp/settings-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshots
          path: /tmp/settings-shots/*.png
          retention-days: 7

  shell-menus:
    name: Shell bar menus (headless smoke test)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: |
          dnf -y install git quickshell qt6-qtsvg qt6-qtwayland sway grim python3 python3-pillow python3-pyte \
            python3-dbus python3-gobject-base librsvg2-tools dbus-daemon swaybg fontconfig google-noto-sans-fonts \
            procps-ng pipewire wireplumber pipewire-utils libcap findutils which glib2
      - uses: actions/checkout@v4
      - name: Every menu opens without QML errors (network from test data, both themes)
        run: |
          set -u
          for theme in polar-night winter; do
            shell/dev/headless.sh --fixtures --theme "$theme" "menus-$theme" \
              ipc panel open network sleep 1 shot "ci-menu-network-$theme" \
              ipc panel open sound sleep 1 shot "ci-menu-sound-$theme" \
              ipc panel open calendar sleep 1 shot "ci-menu-calendar-$theme" \
              ipc quick toggle sleep 1 shot "ci-menu-quick-$theme" \
              ipc quick open display sleep 1 shot "ci-menu-display-$theme" \
              ipc power toggle sleep 1 shot "ci-menu-power-$theme"
            if grep -a -E "TypeError|ReferenceError|SyntaxError|Failed to load|is not a type|unavailable|Cannot assign|Unable to assign" /tmp/arctic-shell.log; then
              echo "QML errors in the shell log ($theme)"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-menu-screenshots
          path: shell/dev/screenshots/ci-menu-*.png
          retention-days: 7

  specs:
    name: RPM specs parse
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git rpm-build systemd-rpm-macros selinux-policy-devel
      - uses: actions/checkout@v4
      - name: rpmspec
        run: |
          for s in packaging/*.spec; do
            echo "== $s"
            rpmspec -q --qf '%{name}-%{version}-%{release}.%{arch}\n' "$s"
          done

  rpms:
    name: Build RPMs (tools/build-rpms.sh)
    runs-on: ubuntu-latest
    needs: [specs]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          # Empty in forks and pull requests from them: arctic-release then ships the Arctic
          # repositories disabled (tools/build-rpms.sh warns).
          ARCTIC_GPG_PUBLIC_KEY: ${{ secrets.ARCTIC_GPG_PUBLIC_KEY }}
        run: |
          tools/build-rpms.sh
          cat out/BUILD-INFO
      - name: Repository (unsigned test publish, dnf5 checks)
        run: |
          tools/publish-repo.sh --no-sign --site out/site --channel testing
          tools/publish-repo.sh --no-sign --site out/site --channel stable
          tools/test-repo.sh --rpms out/repo --site out/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpms
          path: |
            out/repo/*.rpm
            out/BUILD-INFO
            out/logs/
          retention-days: 7
