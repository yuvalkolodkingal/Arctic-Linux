name: Verify River showcase master

on:
  push:
    branches:
      - codex/showcase-river-production
    paths:
      - .github/workflows/showcase-river-verify.yml
      - showcase/**
  workflow_dispatch:

permissions:
  # GitHub hides draft releases from a read-scoped workflow token.
  # This workflow runs only on a trusted branch push or manual dispatch.
  contents: write

concurrency:
  group: showcase-river-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whisper-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned verifier
        run: |
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 av==16.0.1 Pillow==11.3.0

      - name: Resolve the current direct-VoxType River master for private verification
        id: voice
        run: |
          python showcase/revision-2026-10-12/resolve-voice.py \
            --receipt showcase/revision-2026-10-12/voice-timing.json \
            --purpose private-render \
            --github-output "$GITHUB_OUTPUT"

      - name: Download and verify River master
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.voice.outputs.source_tag }}
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
          MASTER_BYTES: ${{ steps.voice.outputs.master_bytes }}
          MASTER_SHA256: ${{ steps.voice.outputs.master_sha256 }}
          MASTER_DURATION: ${{ steps.voice.outputs.master_duration }}
        run: |
          mkdir -p showcase/revision-2026-10-12/work
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MASTER_ASSET" \
            --dir showcase/revision-2026-10-12/work
          test "$(stat -c %s "showcase/revision-2026-10-12/work/$MASTER_ASSET")" = "$MASTER_BYTES"
          printf '%s  %s\n' "$MASTER_SHA256" \
            "showcase/revision-2026-10-12/work/$MASTER_ASSET" | sha256sum --check -
          python - <<'PY'
          import av
          import os
          path = "showcase/revision-2026-10-12/work/" + os.environ["MASTER_ASSET"]
          with av.open(path) as container:
              measured = float(container.duration / av.time_base)
          assert abs(measured - float(os.environ["MASTER_DURATION"])) <= 0.08, measured
          print(f"measured_duration_seconds={measured:.6f}")
          PY

      - name: Preflight pinned decoder and one-second transcription
        env:
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
          MASTER_DURATION: ${{ steps.voice.outputs.master_duration }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import platform
          from pathlib import Path
          from faster_whisper import WhisperModel
          from faster_whisper.audio import decode_audio

          import os
          audio = Path("showcase/revision-2026-10-12/work") / os.environ["MASTER_ASSET"]
          samples = decode_audio(str(audio), sampling_rate=16000)
          expected_samples = float(os.environ["MASTER_DURATION"]) * 16000
          assert abs(len(samples) - expected_samples) <= 32000, len(samples)
          model = WhisperModel("base.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              str(audio),
              language="en",
              beam_size=1,
              word_timestamps=True,
              clip_timestamps="0,1",
          )
          segments = list(segments)
          assert segments and any(segment.words for segment in segments)
          versions = {
              "python": platform.python_version(),
              "faster-whisper": importlib.metadata.version("faster-whisper"),
              "av": importlib.metadata.version("av"),
              "ctranslate2": importlib.metadata.version("ctranslate2"),
              "huggingface-hub": importlib.metadata.version("huggingface-hub"),
              "tokenizers": importlib.metadata.version("tokenizers"),
              "preflight_seconds": 1,
              "preflight_segments": len(segments),
              "preflight_words": sum(len(segment.words or []) for segment in segments),
              "transcript_in_ci_log": False,
          }
          out = Path("showcase/revision-2026-10-12/work/verifier-versions.json")
          out.write_text(json.dumps(versions, indent=2) + "\n")
          print(json.dumps(versions, sort_keys=True))
          PY

      - name: Run local Whisper verification and alignment
        env:
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
          MASTER_DURATION: ${{ steps.voice.outputs.master_duration }}
        run: |
          python showcase/revision-2026-10-12/align-river.py \
            --audio "showcase/revision-2026-10-12/work/$MASTER_ASSET" \
            --captions showcase/revision-2026-10-12/caption-text.json \
            --storyboard showcase/revision-2026-10-12/storyboard.json \
            --output showcase/revision-2026-10-12/work/aligned \
            --model base.en \
            --expected-duration "$MASTER_DURATION" \
            > showcase/revision-2026-10-12/work/verification-summary.json

      - name: Run objective audio and segment-join checks
        env:
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
        run: |
          python showcase/revision-2026-10-12/verify-river-audio.py \
            --audio "showcase/revision-2026-10-12/work/$MASTER_ASSET" \
            --receipt showcase/revision-2026-10-12/voice-timing.json \
            --output showcase/revision-2026-10-12/work/objective-audio-checks.json \
            > showcase/revision-2026-10-12/work/objective-audio-summary.json

      - name: Verify log-safe outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("showcase/revision-2026-10-12/work")
          report = json.loads((root / "aligned/whisper-verification.json").read_text())
          summary = json.loads((root / "verification-summary.json").read_text())
          assert report == summary
          assert report["transcript_in_ci_log"] is False
          assert report["caption_cues"] == 130
          assert report["scenes"] == 38
          assert not report["banned_old_phrase_detected"]
          assert (root / "aligned/whisper-transcript.txt").stat().st_size > 1000
          objective = json.loads((root / "objective-audio-checks.json").read_text())
          objective_summary = json.loads((root / "objective-audio-summary.json").read_text())
          assert objective == objective_summary
          assert objective["full_ffmpeg_decode_errors"] == 0
          assert objective["hard_clipped_samples_ge_0_999"] == 0
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload alignment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: showcase-river-whisper-alignment
          path: |
            showcase/revision-2026-10-12/work/aligned/timing.json
            showcase/revision-2026-10-12/work/aligned/caption-text-aligned.json
            showcase/revision-2026-10-12/work/aligned/captions.srt
            showcase/revision-2026-10-12/work/aligned/captions.vtt
            showcase/revision-2026-10-12/work/aligned/chapters.txt
            showcase/revision-2026-10-12/work/aligned/whisper-verification.json
            showcase/revision-2026-10-12/work/verifier-versions.json
            showcase/revision-2026-10-12/work/objective-audio-checks.json
          if-no-files-found: error
          retention-days: 30
