name: Hash successful final-image performance execution receipt

on:
  push:
    branches: [codex/hash-performance-execution-v2-38559692763]
    paths: [.github/workflows/hash-performance-execution-v2-38559692763.yml]

permissions:
  contents: read
  actions: read

jobs:
  hash:
    if: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.ref == 'refs/heads/codex/hash-performance-execution-v2-38559692763' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Authenticate artifact and emit exact execution receipt hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess, tempfile, zipfile
          from pathlib import Path

          repository = 'yuvalkolodkingal/Arctic-Linux'
          run_id = 38559692763
          source = '26c087252fdf9b9263db5df1eabea13ca8a00300'
          artifact_id = 11899107749
          archive_bytes = 19431747
          archive_sha256 = 'b3864987126640cb494ef5be50cc084d747ece365e8240d29046f46db33eb0e5'
          workflow = '.github/workflows/hash-performance-execution-v2-38559692763.yml'

          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/hash-performance-execution-v2-38559692763'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == source
          assert subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines() == [workflow]

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}{path}']))

          run = api(f'/actions/runs/{run_id}')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_attempt'] == 1 and run['head_sha'] == source
          assert run['event'] == 'push' and run['path'] == '.github/workflows/paired-candidate-20261009.yml'
          endpoint = f'/actions/artifacts/{artifact_id}'
          artifact = api(endpoint)
          assert artifact['name'] == 'external-paired-performance' and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == run_id and artifact['workflow_run']['head_sha'] == source
          assert artifact['size_in_bytes'] == archive_bytes
          assert artifact['digest'] == 'sha256:' + archive_sha256

          with tempfile.TemporaryDirectory(prefix='arctic-performance-hash-') as folder:
              archive = Path(folder) / 'evidence.zip'
              with archive.open('xb') as output:
                  subprocess.run(['gh', 'api', f'repos/{repository}{endpoint}/zip'], stdout=output,
                                 check=True, timeout=8 * 60)
              raw = archive.read_bytes()
              assert len(raw) == archive_bytes and hashlib.sha256(raw).hexdigest() == archive_sha256
              with zipfile.ZipFile(archive) as evidence:
                  entries = evidence.infolist()
                  assert len(entries) <= 1000 and sum(item.file_size for item in entries) <= 512 * 1024 * 1024
                  assert len({item.filename for item in entries}) == len(entries)
                  for item in entries:
                      path = Path(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR)
                  assert 'execution.json' in {item.filename for item in entries}
                  execution_raw = evidence.read('execution.json')
                  assert len(execution_raw) <= 1024 * 1024
                  execution = json.loads(execution_raw)
                  assert execution['run_id'] == run_id and execution['run_attempt'] == 1
                  assert execution['execution_source_sha'] == source
                  assert execution['status'] == 'frozen_external_paired_regression_gate_passed'
                  execution_sha256 = hashlib.sha256(execution_raw).hexdigest()

          result = {
              'schema': 'arctic-performance-execution-hash-v1',
              'run_id': run_id,
              'run_attempt': 1,
              'execution_source_sha': source,
              'artifact_id': artifact_id,
              'archive_bytes': archive_bytes,
              'archive_sha256': archive_sha256,
              'execution_bytes': len(execution_raw),
              'execution_sha256': execution_sha256,
              'status': execution['status'],
              'release_acceptance': False,
          }
          compact = json.dumps(result, sort_keys=True, separators=(',', ':'))
          print(compact)
          print('::notice title=ARCTIC_PERFORMANCE_EXECUTION_HASH::' +
                compact.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
