name: Inspect retained Arctic candidate evidence

on:
  push:
    branches: [codex/inspect-existing-evidence-20261008]
    paths: [.github/workflows/inspect-existing-evidence-20261008.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify fixed artifacts and inspect existing synthetic VM evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile, zipfile
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'yuvalkolodkingal/Arctic-Linux'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/inspect-existing-evidence-20261008'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          repo = 'repos/yuvalkolodkingal/Arctic-Linux'
          evidence = [
              (11575143038, 37830169067, '5680fb12f2c276f83f846e30e3260fdcc79196c6',
               'boot-test', 'fa4e28f5bcb8685fa9232010c817b5f9d7fdd5f16d54c02940106db944c79bd0'),
              (11575333480, 37835601271, 'd24ec7a435d10ed63208db00f6f184fe7060ada9',
               'screen-frame-regression', '274dcc96870af073b6f1b99a0bf046549f38ca58916cefcdf9b16881c52beb26'),
          ]
          sensitive = re.compile(r'(?i)authorization:|(?:gh[pousr]_|github_pat_)[a-z0-9_]+|'
                                 r'(?:password|token|secret)\s*[=:]\s*\S+|'
                                 r'[\w.+-]+@[\w.-]+\.[a-z]{2,}|https?://\S*\?(?:\S*)')
          with tempfile.TemporaryDirectory(prefix='arctic-evidence-') as temp:
              for artifact_id, run_id, source, name, digest in evidence:
                  endpoint = f'{repo}/actions/artifacts/{artifact_id}'
                  metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
                  assert metadata['name'] == name and not metadata['expired'], metadata['name']
                  assert metadata['workflow_run']['id'] == run_id
                  assert metadata['workflow_run']['head_sha'] == source
                  assert metadata['digest'] == 'sha256:' + digest
                  path = Path(temp) / f'{artifact_id}.zip'
                  with path.open('xb') as archive:
                      subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=archive, check=True)
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'archive hash mismatch'
                  print('ARCTIC-ARTIFACT', artifact_id, run_id, source, name, digest, flush=True)
                  with zipfile.ZipFile(path) as archive:
                      assert sum(item.file_size for item in archive.infolist()) < 100_000_000
                      for item in archive.infolist():
                          member = item.filename
                          assert not Path(member).is_absolute() and '..' not in Path(member).parts
                          print('ARCTIC-MEMBER', member, item.file_size)
                          if member.endswith(('serial.log', 'baseline-result.json', 'results.json', 'shell.log', 'compositor.log')):
                              assert item.file_size < 5_000_000
                              lines = archive.read(item).decode('utf-8', errors='replace').splitlines()
                              print('ARCTIC-TEXT-BEGIN', member)
                              for line in lines[-400:]:
                                  print('[redacted diagnostic line]' if sensitive.search(line) else line[:1500])
                              print('ARCTIC-TEXT-END', member)
                          # These are synthetic VM screenshots already authorized for diagnostic upload.
                          selected = member.endswith('99-final.png') or member.endswith('exposed-top-auto-1.5-0-HEADLESS-1.png')
                          if selected:
                              assert item.file_size < 2_000_000
                              content = archive.read(item)
                              assert content.startswith(b'\x89PNG\r\n\x1a\n')
                              encoded = base64.b64encode(content).decode('ascii')
                              print('ARCTIC-PNG-BEGIN', member, hashlib.sha256(content).hexdigest())
                              for offset in range(0, len(encoded), 1024):
                                  print('ARCTIC-PNG-DATA', encoded[offset:offset + 1024])
                              print('ARCTIC-PNG-END', member)
          PY
