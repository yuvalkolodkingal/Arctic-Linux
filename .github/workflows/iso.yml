name: ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the ISO
        type: boolean
        default: false
      tag:
        description: Release tag (default v1.1.0-build.<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release (untick for a stable release such as v1.1.0)
        type: boolean
        default: true
      draft:
        description: Keep the release as a draft for reviewing boot-test results before publication
        type: boolean
        default: false
      nix_acceptance:
        description: Enforcing VM install, Nix GUI and update/reboot acceptance (no release)
        type: boolean
        default: false
      boot_test:
        description: Boot the ISO in QEMU and upload screenshots
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  ISO: Arctic-Linux-1.1-x86_64.iso

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/arctic && sudo chown "$(id -u):$(id -g)" /mnt/arctic
          df -h / /mnt

      - name: Build RPMs
        env:
          # The Arctic repository's public key goes into arctic-release, which then enables the
          # repository (updates for Arctic's own packages). Here the key is required: an ISO
          # without it would install systems that never get Arctic updates. Forks (no secret)
          # still build, with the Arctic repositories disabled.
          ARCTIC_GPG_PUBLIC_KEY: ${{ secrets.ARCTIC_GPG_PUBLIC_KEY }}
          ARCTIC_REQUIRE_GPG_KEY: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && '1' || '0' }}
        run: |
          # Every build gets its own Release (1.<UTC commit time>.<UTC build time>.git<commit>):
          # the repository's builds of newer commits update the packages on the ISO.
          tools/build-rpms.sh
          cat out/BUILD-INFO

      - name: Build ISO
        run: tools/build-iso.sh --work /mnt/arctic/kiwi-work

      - name: Size and split
        id: size
        run: |
          cd out/iso
          size=$(stat -c %s "$ISO")
          echo "ISO size: $size bytes ($((size / 1024 / 1024)) MiB)"
          echo "bytes=$size" >> "$GITHUB_OUTPUT"
          if [ "$size" -gt 2147483648 ]; then
            # GitHub release assets are limited to 2 GiB.
            split -b 1900M -d -a 2 "$ISO" "$ISO.part"
            echo "split=true" >> "$GITHUB_OUTPUT"
            ls -l "$ISO".part*
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the ISO (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: arctic-linux-iso
          path: |
            out/iso/${{ env.ISO }}
            out/iso/${{ env.ISO }}.sha256
            out/iso/*.packages
            out/iso/*.build-info
            out/BUILD-INFO
          compression-level: 0
          retention-days: 14

      - name: Boot test in QEMU (UEFI, Try mode)
        if: ${{ github.event_name == 'push' || inputs.boot_test }}
        continue-on-error: true
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; kvm=--kvm; timeout=420; else kvm=; timeout=900; fi
          tools/test-iso.sh --firmware uefi --mode try --timeout "$timeout" --interval 30 $kvm
          tools/test-iso.sh --firmware bios --mode install --timeout "$timeout" --interval 30 $kvm

      - name: Nix enforcing VM acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nix_acceptance }}
        run: |
          test '${{ inputs.release }}' = false
          test -c /dev/kvm
          # Docker's root test process accesses the passed device; no host chmod or SELinux changes.
          timeout --signal=TERM --kill-after=60s 100m tools/test-install.sh \
            --kvm --memory 4096 --smp 2 --boot-append '' --install-timeout 2400 \
            --guest-check tools/nix-acceptance/guest.py --out "$PWD/out/test/nix"
          cp out/test/nix/serial-boot.log out/test/nix/serial-before-update-reboot.log
          timeout --signal=TERM --kill-after=60s 45m tools/test-install.sh \
            --stage boot --kvm --memory 4096 --smp 2 --boot-append '' \
            --guest-check tools/nix-acceptance/guest.py --out "$PWD/out/test/nix"

      - name: Upload Nix acceptance evidence
        if: ${{ always() && inputs.nix_acceptance }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-acceptance
          retention-days: 14
          path: |
            out/test/nix/
            !out/test/nix/*.qcow2
            !out/test/nix/*.iso
            !out/test/nix/*.sock

      - name: Upload screenshots
        if: ${{ always() && (github.event_name == 'push' || inputs.boot_test) }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ steps.size.outputs.split }}
          CANONICAL: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' }}
        run: |
          # A released ISO must install systems that get Arctic's updates.
          if [ "$CANONICAL" = true ] && ! grep -qx 'arctic_repos=enabled' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
            echo "::error title=Arctic repositories disabled::out/iso/${ISO%.iso}.build-info lacks arctic_repos=enabled: arctic-release was built without the repository key (ARCTIC_GPG_PUBLIC_KEY). Not publishing a release whose systems would never get Arctic updates."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; pre=""
          else
            tag="${{ inputs.tag }}"; [ -n "$tag" ] || tag="v1.1.0-build.$GITHUB_RUN_NUMBER"
            pre=""; [ "${{ inputs.prerelease }}" = false ] || pre="--prerelease"
          fi
          sha="$(cut -d' ' -f1 "out/iso/$ISO.sha256")"
          {
            echo "Arctic Linux 1.1 live ISO (Fedora 44 base, Mango desktop) for x86_64, UEFI and BIOS."
            echo
            echo "Write it to a USB stick (at least 4 GB), for example with Fedora Media Writer or"
            echo "\`sudo dd if=$ISO of=/dev/sdX bs=4M status=progress oflag=sync\`, and boot from it."
            echo "The boot menu offers **Try Arctic Linux** and **Install Arctic Linux**."
            if grep -q 'zen_preinstalled=1' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
              echo "Zen Browser is preinstalled in the live session."
            fi
            echo
            if grep -q '^arctic_repos=enabled' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
              echo "Updates: Fedora's packages come from Fedora's repositories, Arctic's own packages (desktop,"
              echo "shell, installer, branding, Mango) from the signed Arctic package repository,"
              echo "https://yuvalkolodkingal.github.io/Arctic-Linux/ (the stable channel; the testing channel is off)."
            else
              echo "Updates: Fedora's packages update as usual. This ISO was built without the Arctic repository"
              echo "key, so the Arctic package repository is disabled on it."
            fi
            echo
            echo "SHA-256: \`$sha\`"
            if [ "$SPLIT" = true ]; then
              echo
              echo "The ISO is larger than GitHub's 2 GiB asset limit, so it is split into parts."
              echo "Download every \`$ISO.partNN\` file and \`$ISO.sha256\`, then join and check them:"
              echo
              echo '```'
              echo "cat $ISO.part* > $ISO"
              echo "sha256sum -c $ISO.sha256"
              echo '```'
              echo
              echo "On Windows (PowerShell): \`cmd /c copy /b $ISO.part00+$ISO.part01 $ISO\` (list every part)."
            fi
          } > notes.md
          if [ -f "docs/releases/${tag}.md" ]; then
            cat "docs/releases/${tag}.md" notes.md > release-notes.md
            mv release-notes.md notes.md
          fi
          if [ "$SPLIT" = true ]; then
            files=(out/iso/"$ISO".part* "out/iso/$ISO.sha256")
          else
            files=("out/iso/$ISO" "out/iso/$ISO.sha256")
          fi
          draft=""; [ "${{ inputs.draft }}" != true ] || draft="--draft"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Arctic Linux ${tag#v}" --notes-file notes.md $pre $draft
