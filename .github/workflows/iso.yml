name: ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      offline_cycle_recovery:
        description: Offline-only three-phase qualification of fixed candidate 37507582946 (no build/release)
        type: boolean
        default: false
      same_iso_recovery:
        description: Reuse fixed candidate 37507582946 for VM qualification only (requires confirmed original Nix failure)
        type: boolean
        default: false
      release:
        description: Publish a GitHub release with the ISO
        type: boolean
        default: false
      tag:
        description: Release tag (default v1.2.0-build.<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release (untick for a stable release such as v1.2.0)
        type: boolean
        default: true
      draft:
        description: Keep the release as a draft for reviewing boot-test results before publication
        type: boolean
        default: false
      nix_acceptance:
        description: Enforcing VM install, Nix GUI and update/reboot acceptance (no release)
        type: boolean
        default: false
      performance_acceptance:
        description: Three paired KVM boots versus immutable v1.2 (artifact only)
        type: boolean
        default: false
      boot_test:
        description: Boot the ISO in QEMU and upload screenshots
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  ISO: Arctic-Linux-1.2-x86_64.iso

jobs:
  iso:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.same_iso_recovery && !inputs.offline_cycle_recovery) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # These collections are already export-ignored from the RPM source.
          # build-rpms also avoids archive prefetching their omitted blobs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Wallpapers/
            !/v2-walls/
            !/showcase/

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/arctic && sudo chown "$(id -u):$(id -g)" /mnt/arctic
          df -h / /mnt

      - name: Reuse trusted branch build downloads and compiler objects
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/cache/build
            out/cache/iso
            out/sources
          # Keep preview branches/tags isolated. Go additionally checks the actual
          # builder/native RPM identity; fresh RPM assembly and checks still run.
          key: arctic-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-${{ hashFiles('packaging/*.spec', 'iso/kiwi/config.kiwi') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arctic-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-${{ hashFiles('packaging/*.spec', 'iso/kiwi/config.kiwi') }}-
            arctic-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-

      - name: Build RPMs
        env:
          # The Arctic repository's public key goes into arctic-release, which then enables the
          # repository (updates for Arctic's own packages). Here the key is required: an ISO
          # without it would install systems that never get Arctic updates. Forks (no secret)
          # still build, with the Arctic repositories disabled.
          ARCTIC_GPG_PUBLIC_KEY: ${{ secrets.ARCTIC_GPG_PUBLIC_KEY }}
          ARCTIC_REQUIRE_GPG_KEY: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && '1' || '0' }}
        run: |
          # Every build gets its own Release (1.<UTC commit time>.<UTC build time>.git<commit>):
          # the repository's builds of newer commits update the packages on the ISO.
          if [ '${{ github.event_name }}' = workflow_dispatch ] && [ '${{ inputs.release }}' = false ]; then
            # Artifact-only candidates must remain replaceable by normal signed stable
            # updates, even when the stable source commit predates this test branch.
            tools/build-rpms.sh --release-suffix ".preview.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.git$(git rev-parse --short HEAD)"
          else
            tools/build-rpms.sh
          fi
          cat out/BUILD-INFO

      - name: Build ISO
        # Native GNOME Web and the approved default apps are mandatory in config.kiwi.
        # A missed size target retains the artifact and never triggers feature removal.
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ] && [ '${{ inputs.release }}' = false ]; then
            candidate="Arctic-Linux-1.2-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-x86_64.iso"
            echo "ISO=$candidate" >> "$GITHUB_ENV"
            if ! tools/build-iso.sh --work /mnt/arctic/kiwi-work --name "$candidate" \
              --max-bytes 1999999999 --preferred-max-bytes 1599999999; then
              # A missed size target is reviewable; failed image creation is not.
              test -s "out/iso/$candidate"
              (cd out/iso && sha256sum --check "$candidate.sha256")
              grep -qx 'size_target_met=no' "out/iso/${candidate%.iso}.build-info"
              echo 'Size target missed; retaining the full-feature test artifact.'
            fi
          else
            tools/build-iso.sh --work /mnt/arctic/kiwi-work
          fi

      - name: Save verified build downloads and compiler objects
        uses: actions/cache/save@v4
        with:
          path: |
            out/cache/build
            out/cache/iso
            out/sources
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Size and split
        id: size
        run: |
          cd out/iso
          sha256sum --check "$ISO.sha256"
          size=$(stat -c %s "$ISO")
          echo "ISO size: $size bytes ($((size / 1024 / 1024)) MiB)"
          echo "bytes=$size" >> "$GITHUB_OUTPUT"
          if [ "$size" -gt 2147483648 ]; then
            # GitHub release assets are limited to 2 GiB.
            split -b 1900M -d -a 2 "$ISO" "$ISO.part"
            echo "split=true" >> "$GITHUB_OUTPUT"
            ls -l "$ISO".part*
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the ISO (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: arctic-linux-iso
          path: |
            out/iso/${{ env.ISO }}
            out/iso/${{ env.ISO }}.sha256
            out/iso/*.packages
            out/iso/*.build-info
            out/iso/*.rpm-inventory.tsv
            out/iso/*.flatpak-refs.txt
            out/BUILD-INFO
          compression-level: 0
          retention-days: 14

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: arctic-iso-metadata
          path: |
            out/BUILD-INFO
            out/iso/*.sha256
            out/iso/*.build-info
            out/iso/*.packages
            out/iso/*.rpm-inventory.tsv
            out/iso/*.flatpak-refs.txt
          retention-days: 14

      - name: Boot test in QEMU (UEFI, Try mode)
        if: ${{ github.event_name == 'push' || inputs.release || inputs.boot_test }}
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; kvm=--kvm; timeout=420; else kvm=; timeout=900; fi
          tools/test-iso.sh --iso "out/iso/$ISO" --firmware uefi --mode try --timeout "$timeout" --interval 30 $kvm
          tools/test-iso.sh --iso "out/iso/$ISO" --firmware bios --mode install --timeout "$timeout" --interval 30 $kvm
          tools/test-iso.sh --iso "out/iso/$ISO" --firmware uefi --mode safe --timeout "$timeout" --interval 30 $kvm

      - name: Nix enforcing VM acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nix_acceptance }}
        run: |
          test '${{ inputs.release }}' = false
          test -c /dev/kvm
          # Docker's root test process accesses the passed device; no host chmod or SELinux changes.
          # Live install stays restricted/offline; installed Nix fetch/update checks explicitly use NAT.
          timeout --signal=TERM --kill-after=60s 100m tools/test-install.sh --iso "out/iso/$ISO" \
            --kvm --memory 4096 --smp 2 --boot-append '' --install-timeout 2400 --boot-network online \
            --guest-check tools/nix-acceptance/guest.py --out "$PWD/out/test/nix"
          cp out/test/nix/serial-boot.log out/test/nix/serial-before-update-reboot.log
          timeout --signal=TERM --kill-after=60s 45m tools/test-install.sh \
            --stage boot --kvm --memory 4096 --smp 2 --boot-append '' --boot-network online \
            --guest-check tools/nix-acceptance/guest.py --out "$PWD/out/test/nix"

      - name: Upload Nix acceptance evidence
        if: ${{ always() && inputs.nix_acceptance }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-acceptance
          retention-days: 14
          path: |
            out/test/nix/
            !out/test/nix/*.qcow2
            !out/test/nix/*.iso
            !out/test/nix/*.sock

      - name: Paired KVM performance acceptance
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.performance_acceptance }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ inputs.release }}' = false
          test -s "out/iso/$ISO"
          test -c /dev/kvm
          baseline=/mnt/arctic/baseline
          mkdir -p "$baseline"
          gh release download v1.2.0 --repo yuvalkolodkingal/Arctic-Linux --dir "$baseline" \
            --pattern 'Arctic-Linux-1.2-x86_64.iso.part00' --pattern 'Arctic-Linux-1.2-x86_64.iso.part01'
          cat "$baseline/Arctic-Linux-1.2-x86_64.iso.part00" "$baseline/Arctic-Linux-1.2-x86_64.iso.part01" \
            > "$baseline/Arctic-Linux-1.2-x86_64.iso"
          rm "$baseline/Arctic-Linux-1.2-x86_64.iso.part00" "$baseline/Arctic-Linux-1.2-x86_64.iso.part01"
          timeout --signal=TERM --kill-after=60s 120m python3 tools/performance/run-paired.py \
            --baseline "$baseline/Arctic-Linux-1.2-x86_64.iso" --candidate "out/iso/$ISO" --out "$PWD/out/test/performance"

      - name: Upload paired performance evidence
        if: ${{ always() && inputs.performance_acceptance }}
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance
          retention-days: 14
          path: |
            out/test/performance/
            !out/test/performance/**/*.qcow2
            !out/test/performance/**/*.iso
            !out/test/performance/**/*.sock

      - name: Upload screenshots
        if: ${{ always() && (github.event_name == 'push' || inputs.release || inputs.boot_test) }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            out/test/
            !out/test/**/*.qcow2
            !out/test/**/*.iso
            !out/test/**/*.sock
          if-no-files-found: ignore
          retention-days: 14

      - name: Required optimized ISO size
        run: |
          bytes=$(stat -c %s "out/iso/$ISO")
          echo "Required: strictly below 2000000000 decimal bytes; preferred: below 1600000000. Actual: $bytes"
          test "$bytes" -lt 2000000000

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ steps.size.outputs.split }}
          CANONICAL: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' }}
        run: |
          # A released ISO must install systems that get Arctic's updates.
          if [ "$CANONICAL" = true ] && ! grep -qx 'arctic_repos=enabled' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
            echo "::error title=Arctic repositories disabled::out/iso/${ISO%.iso}.build-info lacks arctic_repos=enabled: arctic-release was built without the repository key (ARCTIC_GPG_PUBLIC_KEY). Not publishing a release whose systems would never get Arctic updates."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; pre=""
          else
            tag="${{ inputs.tag }}"; [ -n "$tag" ] || tag="v1.2.0-build.$GITHUB_RUN_NUMBER"
            pre=""; [ "${{ inputs.prerelease }}" = false ] || pre="--prerelease"
          fi
          sha="$(cut -d' ' -f1 "out/iso/$ISO.sha256")"
          {
            echo "Arctic Linux 1.2 live ISO (Fedora 44 base, Mango desktop) for x86_64, UEFI and BIOS."
            echo
            echo "Write it to a USB stick (at least 4 GB), for example with Fedora Media Writer or"
            echo "\`sudo dd if=$ISO of=/dev/sdX bs=4M status=progress oflag=sync\`, and boot from it."
            echo "The boot menu offers **Try Arctic Linux** and **Install Arctic Linux**."
            echo "GNOME Web, Foot, PCManFM, XArchiver, Celluloid and FeatherPad are preinstalled."
            echo "Zen, Firefox and richer alternatives remain available through Get apps."
            if grep -q 'zen_preinstalled=1' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
              echo "Zen Browser is preinstalled in the live session."
            fi
            echo
            if grep -q '^arctic_repos=enabled' "out/iso/${ISO%.iso}.build-info" 2>/dev/null; then
              echo "Updates: Fedora's packages come from Fedora's repositories, Arctic's own packages (desktop,"
              echo "shell, installer, branding, Mango) from the signed Arctic package repository,"
              echo "https://yuvalkolodkingal.github.io/Arctic-Linux/ (the stable channel; the testing channel is off)."
            else
              echo "Updates: Fedora's packages update as usual. This ISO was built without the Arctic repository"
              echo "key, so the Arctic package repository is disabled on it."
            fi
            echo
            echo "SHA-256: \`$sha\`"
            if [ "$SPLIT" = true ]; then
              echo
              echo "The ISO is larger than GitHub's 2 GiB asset limit, so it is split into parts."
              echo "Download every \`$ISO.partNN\` file and \`$ISO.sha256\`, then join and check them:"
              echo
              echo '```'
              echo "cat $ISO.part* > $ISO"
              echo "sha256sum -c $ISO.sha256"
              echo '```'
              echo
              echo "On Windows (PowerShell): \`cmd /c copy /b $ISO.part00+$ISO.part01 $ISO\` (list every part)."
            fi
          } > notes.md
          if [ -f "docs/releases/${tag}.md" ]; then
            cat "docs/releases/${tag}.md" notes.md > release-notes.md
            mv release-notes.md notes.md
          fi
          if [ "$SPLIT" = true ]; then
            files=(out/iso/"$ISO".part* "out/iso/$ISO.sha256")
          else
            files=("out/iso/$ISO" "out/iso/$ISO.sha256")
          fi
          draft=""; [ "${{ inputs.draft }}" != true ] || draft="--draft"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Arctic Linux ${tag#v}" --notes-file notes.md $pre $draft

  same-iso-installs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.same_iso_recovery && !inputs.offline_cycle_recovery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        method: [dnf, arctic-offline]
    env:
      METHOD: ${{ matrix.method }}
      RECOVERY_MODE: "true"
      RELEASE_REQUESTED: ${{ inputs.release && 'true' || 'false' }}
    steps:
      - name: Checkout immutable candidate harness source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe4742c8b9414c45f0bcbb0a4191f116383c60d1
          path: candidate-source
          persist-credentials: false
          sparse-checkout: |
            tools
            profiles/ci
      - name: Checkout reviewed qualification execution source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: qualification-source
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/workflows
      - name: Declare fresh method-specific paths
        shell: bash
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/arctic-same-iso-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${METHOD}"
          test ! -e "$recovery_root"
          mkdir "$recovery_root"
          echo "RECOVERY_ROOT=$recovery_root" >> "$GITHUB_ENV"
      - name: Fail closed on original result, source, checker, and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 qualification-source/tools/same-iso-recovery/vm-only-recovery-v2.py preflight             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Download exact existing ISO artifact for these VM tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: yuvalkolodkingal/Arctic-Linux
          run-id: 37507582946
          artifact-ids: 11434226349
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.RECOVERY_ROOT }}/inputs
      - name: Verify actual ISO bytes and frozen checker before any VM
        run: |
          python3 qualification-source/tools/same-iso-recovery/vm-only-recovery-v2.py verify             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Run fresh same-image qualification
        run: |
          python3 qualification-source/tools/same-iso-recovery/vm-only-recovery-v2.py run             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Preserve only new evidence, including failures
        if: ${{ always() && env.RECOVERY_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-iso-37507582946-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.method }}
          path: ${{ env.RECOVERY_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 14

  same-iso-boot-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.same_iso_recovery && !inputs.offline_cycle_recovery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        method: [uefi-sb-try, uefi-safe, bios-try]
    env:
      METHOD: ${{ matrix.method }}
      RECOVERY_MODE: "true"
      RELEASE_REQUESTED: ${{ inputs.release && 'true' || 'false' }}
    steps:
      - name: Checkout immutable candidate harness source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe4742c8b9414c45f0bcbb0a4191f116383c60d1
          path: candidate-source
          persist-credentials: false
          sparse-checkout: |
            tools
            profiles/ci
      - name: Checkout reviewed qualification execution source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: qualification-source
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/workflows
      - name: Declare fresh method-specific paths
        shell: bash
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/arctic-same-iso-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${METHOD}"
          test ! -e "$recovery_root"
          mkdir "$recovery_root"
          echo "RECOVERY_ROOT=$recovery_root" >> "$GITHUB_ENV"
      - name: Fail closed on original result, source, checker, and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 qualification-source/tools/same-iso-recovery/boot-evidence-v2.py preflight             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Download exact existing ISO artifact for these VM tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: yuvalkolodkingal/Arctic-Linux
          run-id: 37507582946
          artifact-ids: 11434226349
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.RECOVERY_ROOT }}/inputs
      - name: Verify actual ISO bytes and frozen checker before any VM
        run: |
          python3 qualification-source/tools/same-iso-recovery/boot-evidence-v2.py verify             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Run fresh same-image qualification
        run: |
          python3 qualification-source/tools/same-iso-recovery/boot-evidence-v2.py run             --method "$METHOD" --source "$GITHUB_WORKSPACE/candidate-source"             --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-recovery"             --inputs "$RECOVERY_ROOT/inputs" --evidence "$RECOVERY_ROOT/evidence"
      - name: Preserve only new evidence, including failures
        if: ${{ always() && env.RECOVERY_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-iso-37507582946-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.method }}
          path: ${{ env.RECOVERY_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 14

  same-iso-offline-cycle-v5:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.offline_cycle_recovery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    env:
      RECOVERY_MODE: "true"
      OFFLINE_CYCLE_RECOVERY_MODE: "true"
      SAME_ISO_RECOVERY_REQUESTED: ${{ inputs.same_iso_recovery && 'true' || 'false' }}
      RELEASE_REQUESTED: ${{ inputs.release && 'true' || 'false' }}
    steps:
      - name: Checkout immutable candidate harness source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe4742c8b9414c45f0bcbb0a4191f116383c60d1
          path: candidate-source
          persist-credentials: false
          sparse-checkout: |
            tools
            profiles/ci
      - name: Checkout independently reviewed offline execution source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: qualification-source
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/workflows
      - name: Declare fresh offline-only paths
        shell: bash
        run: |
          set -euo pipefail
          cycle_root="$RUNNER_TEMP/arctic-offline-cycle-v5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$cycle_root"
          mkdir "$cycle_root"
          echo "CYCLE_ROOT=$cycle_root" >> "$GITHUB_ENV"
      - name: Fail closed on reviewed source and immutable original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 qualification-source/tools/same-iso-offline-v5/offline-only-recovery-v5.py preflight \
            --source "$GITHUB_WORKSPACE/candidate-source" \
            --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-offline-v5" \
            --inputs "$CYCLE_ROOT/inputs" --evidence "$CYCLE_ROOT/evidence"
      - name: Download only the exact existing candidate ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: yuvalkolodkingal/Arctic-Linux
          run-id: 37507582946
          artifact-ids: 11434226349
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.CYCLE_ROOT }}/inputs
      - name: Verify actual candidate bytes before VM qualification
        run: |
          python3 qualification-source/tools/same-iso-offline-v5/offline-only-recovery-v5.py verify \
            --source "$GITHUB_WORKSPACE/candidate-source" \
            --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-offline-v5" \
            --inputs "$CYCLE_ROOT/inputs" --evidence "$CYCLE_ROOT/evidence"
      - name: Fresh install and staging, restricted update cycle, mandatory third boot
        run: |
          python3 qualification-source/tools/same-iso-offline-v5/offline-only-recovery-v5.py run \
            --source "$GITHUB_WORKSPACE/candidate-source" \
            --bundle "$GITHUB_WORKSPACE/qualification-source/tools/same-iso-offline-v5" \
            --inputs "$CYCLE_ROOT/inputs" --evidence "$CYCLE_ROOT/evidence"
      - name: Preserve actual phase evidence including failure
        if: ${{ always() && env.CYCLE_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-iso-offline-cycle-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CYCLE_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 14
