name: Publish verified Arctic v1.2.0 torrent metadata

# Isolated, manual, one-time metadata publication. No ISO build or tag change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verified-arctic-v1.2.0-torrent
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.ref == 'refs/heads/codex/publish-verified-v1.2.0-torrent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed metadata bytes and successful complete web-seed download
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.github/release/torrent-v1.2.0')
          for name,digest in json.loads((root/'expected-assets.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          report=json.loads((root/'Arctic-Linux-1.2-TORRENT-verification.json').read_text())
          assert report['release_id']==403366368
          assert report['iso_source_commit']=='d13da6c907460136fc22017314112ce351592a3f'
          assert report['iso']['bytes']==2322073600
          assert report['iso']['sha256']=='054db5c43cae47fb60f8f43efc8e052b569aa1b14e8f15adcb15cdc48265182f'
          assert report['torrent']['infohash_v1']=='3751d7869ff5cdf50124568e93fe050b02fee559'
          assert report['fresh_webseed_download']['complete']
          assert report['fresh_webseed_download']['verified_pieces']==2215
          assert report['fresh_webseed_download']['verified_bytes']==2322073600
          assert not report['fresh_webseed_download']['source_errors']
          print('Verified exact prepared torrent and recorded full download evidence.')
          PY
      - name: Add new release assets and verify anonymous downloads
        run: python3 .github/release/torrent-v1.2.0/upload.py
