name: Final exact-image BIOS with bounded complete CSI separation

on:
  push:
    branches: [codex/final-bios-general-csi-install-20261011]
    paths: [.github/final-bios-general-csi-install-20261011.activate]

permissions:
  contents: read
  actions: read

jobs:
  bios-installed-boot:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    # Original ISO transport, owned tools, and unchanged encrypted harness.
    # The install engine keeps its original 2400s bound; total host bound is 6600s.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: execution
          fetch-depth: 0
          persist-credentials: false
      - name: Read disabled-by-default exact final-image BIOS manifest
        id: image
        working-directory: execution
        run: |
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'tools/final-bios-general-csi-install')
          import common
          value=common.manifest(common.strict_json(Path('tools/final-bios-general-csi-install/execution-manifest.json').read_bytes()),True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('source='+value['image']['source_sha']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ steps.image.outputs.source }}
          persist-credentials: false
      - name: Verify sole first marker, exact Source and all execution pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'execution/tools/final-bios-general-csi-install')
          import common
          common.guard(common.manifest(common.strict_json(Path('execution/tools/final-bios-general-csi-install/execution-manifest.json').read_bytes()),True),Path('source').resolve())
          PY
      - name: Install original PNG decoder and same-buffer OCR
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-pil tesseract-ocr
      - name: Fetch original final ISO and verify archive and ISO bytes
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/arctic-final-bios-csi-boundary"
          python3 -B execution/tools/native-functional/fetch-image.py --manifest execution/tools/final-bios-general-csi-install/execution-manifest.json --out "$RUNNER_TEMP/arctic-final-bios-csi-boundary/inputs"
      - name: Original encrypted offline BIOS install and installed disk boot with bounded complete CSI separation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B execution/tools/final-bios-general-csi-install/run.py --source "$GITHUB_WORKSPACE/source" --inputs "$RUNNER_TEMP/arctic-final-bios-csi-boundary/inputs" --out "$RUNNER_TEMP/arctic-final-bios-csi-boundary/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-bios-general-csi-install-originals
          path: ${{ runner.temp }}/arctic-final-bios-csi-boundary/evidence/public/
          if-no-files-found: ignore
          retention-days: 14
