        run: exit 1
      - name: Safe reader rejected at report-inventory
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'report-inventory' }}
        run: exit 1
      - name: Safe reader rejected at live-report
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'live-report' }}
        run: exit 1
      - name: Safe reader rejected at live receipt
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'live-receipt' }}
        run: exit 1
      - name: Safe reader rejected at live hash
