name: Read safe Turbo diagnostics for dictation run 38851481257

on:
  push:
    branches: [codex/read-dictation-turbo-388479-20261016]
    paths: [.github/dictation-turbo-failure-reader-388514.activate]

permissions:
  contents: read
  actions: read

jobs:
  read-safe-diagnostics:
    if: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.ref == 'refs/heads/codex/read-dictation-turbo-388479-20261016' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the closed-vocabulary reader
        run: python3 -B -m unittest tools/dictation-turbo-failure-reader-388514/test_read.py
      - name: Read only validated staged diagnostics
        id: diagnostic
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/dictation-turbo-failure-reader-388514/read.py
          --manifest tools/dictation-turbo-failure-reader-388514/execution-manifest.json
      - name: Safe reader rejected at manifest
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'manifest' }}
        run: exit 1
      - name: Safe reader rejected at run
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'run' }}
        run: exit 1
      - name: Safe reader rejected at artifact-metadata
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'artifact-metadata' }}
        run: exit 1
      - name: Safe reader rejected at archive
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'archive' }}
        run: exit 1
      - name: Safe reader rejected at fixtures
        if: ${{ steps.diagnostic.outcome == 'failure' && steps.diagnostic.outputs.rejection == 'fixtures' }}
        run: exit 1
      - name: Safe reader rejected at execution
