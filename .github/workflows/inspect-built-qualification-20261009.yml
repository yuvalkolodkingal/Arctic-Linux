name: Inspect candidate 37903438836 metadata

on:
  push:
    branches: [codex/inspect-candidate-379034]
    paths: [.github/workflows/inspect-built-qualification-20261009.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify fixed retained metadata archive and report image identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re, stat, subprocess, tempfile, zipfile
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'yuvalkolodkingal/Arctic-Linux'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/inspect-candidate-379034'
          endpoint = 'repos/yuvalkolodkingal/Arctic-Linux/actions/artifacts/11604117213'
          digest = '12753a67841065e424587b57829ca5d5631c1574326473e3cdd82e101fde08c2'
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert metadata['name'] == 'arctic-iso-metadata' and not metadata['expired']
          assert metadata['workflow_run']['id'] == 37903438836
          assert metadata['workflow_run']['head_sha'] == 'e2a62bb8945f7fe9975cb862986af4dd2be0873d'
          assert metadata['size_in_bytes'] == 31830 and metadata['digest'] == 'sha256:' + digest
          sensitive = re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|(?:AKIA|ASIA)[A-Z0-9]{16}|-----BEGIN[^\n]*PRIVATE KEY|password\s*[:=]\s*\S+|Authorization\s*[:=]|https?://[^\s]*\?[^\s]', re.I)
          with tempfile.TemporaryDirectory(prefix='arctic-iso-metadata-') as folder:
              path = Path(folder) / 'retained.zip'
              with path.open('xb') as output:
                  subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=output, check=True)
              assert path.stat().st_size == 31830 and hashlib.sha256(path.read_bytes()).hexdigest() == digest
              with zipfile.ZipFile(path) as archive:
                  items = archive.infolist()
                  assert len(items) <= 30 and sum(item.file_size for item in items) < 2_000_000
                  assert len({item.filename for item in items}) == len(items)
                  for item in items:
                      p = Path(item.filename)
                      assert not p.is_absolute() and '..' not in p.parts
                      assert (item.external_attr >> 16 & 0o170000) in (0, 0o100000), 'Unsupported metadata member type'
                      print('ARCTIC-ISO-METADATA-MEMBER', item.filename, item.file_size)
                      if p.name == 'BUILD-INFO' or p.suffix in ('.sha256', '.build-info'):
                          assert item.file_size < 100_000
                          text = archive.read(item).decode('utf-8', errors='strict')
                          assert not sensitive.search(text), 'Sensitive metadata refused'
                          assert len(text.splitlines()) <= 300
                          print('ARCTIC-ISO-METADATA-BEGIN', item.filename)
                          print(text)
                          print('ARCTIC-ISO-METADATA-END', item.filename)
          PY
