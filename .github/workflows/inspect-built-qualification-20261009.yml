name: Inspect candidate 38785714856 small metadata

on:
  push:
    branches: [codex/inspect-candidate-387857]
    paths: [.github/workflows/inspect-built-qualification-20261009.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify fixed small artifacts and report candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import tempfile
          import zipfile

          REPOSITORY = 'yuvalkolodkingal/Arctic-Linux'
          RUN_ID = 38785714856
          SOURCE_SHA = '3e16234b71ad64c27ab24871d51863b940ad2521'
          ARTIFACTS = {
              'metadata': {
                  'id': 11998149206,
                  'name': 'arctic-iso-metadata',
                  'bytes': 31874,
                  'sha256': '9b8667f671a4f60856a8ebde4dcc2fb46ad527d9617d35a92781f7178df5e783',
                  'members': 40,
                  'expanded_bytes': 2_000_000,
              },
              'receipt': {
                  'id': 12000912116,
                  'name': 'arctic-external-producer-receipt',
                  'bytes': 1700,
                  'sha256': '500036241f37355d0c98b05b585aeb7c89ce2c1b5a788f1bc6876185143a9b83',
                  'members': 1,
                  'expanded_bytes': 32_768,
              },
          }
          HEX64 = re.compile(r'[0-9a-f]{64}')
          SENSITIVE = re.compile(
              r'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|(?:AKIA|ASIA)[A-Z0-9]{16}|'
              r'-----BEGIN[^\n]*PRIVATE KEY|password\s*[:=]\s*\S+|Authorization\s*[:=]|'
              r'https?://[^\s]*\?[^\s]', re.I)

          def api(endpoint):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{REPOSITORY}/{endpoint}'], timeout=60))

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, 'Duplicate JSON field'
                  result[key] = value
              return result

          def safe_member(item):
              name = item.filename
              path = PurePosixPath(name)
              mode = item.external_attr >> 16
              kind = stat.S_IFMT(mode)
              assert name and len(name.encode()) <= 1024
              assert '\\' not in name and '\x00' not in name
              assert not path.is_absolute() and all(part not in ('', '.', '..') for part in path.parts)
              assert not item.is_dir() and not name.endswith('/')
              assert kind in (0, stat.S_IFREG), f'Unsupported artifact member type: {name}'
              assert not item.flag_bits & 0x1, f'Encrypted artifact member refused: {name}'
              assert item.file_size >= 0 and item.compress_size >= 0

          def safe_text(raw, name, max_bytes, max_lines):
              assert 0 < len(raw) <= max_bytes, f'Invalid text member size: {name}'
              text = raw.decode('utf-8', errors='strict')
              assert '\x00' not in text and not any(
                  ord(char) < 32 and char not in '\n\r\t' for char in text), f'Control byte in {name}'
              assert len(text.splitlines()) <= max_lines, f'Too many lines in {name}'
              assert not SENSITIVE.search(text), f'Sensitive text refused: {name}'
              return text

          assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/inspect-candidate-387857'
          run = api(f'actions/runs/{RUN_ID}')
          assert run['id'] == RUN_ID
          assert run['name'] == 'ISO' and run['path'] == '.github/workflows/iso.yml'
          assert run['workflow_id'] == 368518403
          assert run['head_branch'] == 'codex/qualification-dispatch-20261010'
          assert run['head_sha'] == SOURCE_SHA
          assert run['event'] == 'workflow_dispatch' and run['run_attempt'] == 1
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == REPOSITORY
          assert run['head_repository']['full_name'] == REPOSITORY

          with tempfile.TemporaryDirectory(prefix='arctic-small-artifacts-') as folder:
              root = Path(folder)
              archives = {}
              for label, expected in ARTIFACTS.items():
                  endpoint = f'actions/artifacts/{expected["id"]}'
                  metadata = api(endpoint)
                  assert metadata['id'] == expected['id'] and metadata['name'] == expected['name']
                  assert metadata['expired'] is False
                  assert metadata['workflow_run']['id'] == RUN_ID
                  assert metadata['workflow_run']['head_sha'] == SOURCE_SHA
                  assert metadata['workflow_run']['head_branch'] == 'codex/qualification-dispatch-20261010'
                  assert metadata['size_in_bytes'] == expected['bytes']
                  assert metadata['digest'] == 'sha256:' + expected['sha256']
                  archive_path = root / f'{label}.zip'
                  with archive_path.open('xb') as output:
                      subprocess.run(
                          ['gh', 'api', endpoint + '/zip'], stdout=output, check=True, timeout=60)
                  assert archive_path.stat().st_size == expected['bytes']
                  assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == expected['sha256']
                  archives[label] = archive_path

              with zipfile.ZipFile(archives['metadata']) as archive:
                  assert archive.testzip() is None, 'Metadata ZIP CRC failure'
                  items = archive.infolist()
                  assert 1 <= len(items) <= ARTIFACTS['metadata']['members']
                  assert len({item.filename for item in items}) == len(items)
                  assert sum(item.file_size for item in items) < ARTIFACTS['metadata']['expanded_bytes']
                  printed = []
                  for item in items:
                      safe_member(item)
                      print('ARCTIC-ISO-METADATA-MEMBER', item.filename, item.file_size)
                      path = PurePosixPath(item.filename)
                      if path.name == 'BUILD-INFO' or path.name.endswith(('.sha256', '.build-info')):
                          text = safe_text(archive.read(item), item.filename, 100_000, 300)
                          print('ARCTIC-ISO-METADATA-BEGIN', item.filename)
                          print(text, end='' if text.endswith('\n') else '\n')
                          print('ARCTIC-ISO-METADATA-END', item.filename)
                          printed.append(path.name)
                  assert 'BUILD-INFO' in printed
                  assert sum(name.endswith('.sha256') for name in printed) == 1
                  assert sum(name.endswith('.build-info') for name in printed) == 1

              with zipfile.ZipFile(archives['receipt']) as archive:
                  assert archive.testzip() is None, 'Receipt ZIP CRC failure'
                  items = archive.infolist()
                  assert len(items) == 1 and items[0].filename == 'PERFORMANCE-PLAN.json'
                  safe_member(items[0])
                  assert 0 < items[0].file_size <= ARTIFACTS['receipt']['expanded_bytes']
                  raw = archive.read(items[0])
                  text = safe_text(raw, items[0].filename, 32_768, 500)
                  receipt = json.loads(text, object_pairs_hook=unique)

              assert set(receipt) == {
                  'schema', 'repository', 'workflow', 'event', 'source_sha', 'run_id',
                  'run_attempt', 'mode', 'release_acceptance', 'inputs', 'image', 'startup_results'}
              assert receipt['schema'] == 'arctic-producer-performance-receipt-v1'
              assert receipt['repository'] == REPOSITORY
              assert receipt['workflow'] == '.github/workflows/iso.yml'
              assert receipt['event'] == 'workflow_dispatch'
              assert receipt['source_sha'] == SOURCE_SHA
              assert receipt['run_id'] == RUN_ID and type(receipt['run_id']) is int
              assert receipt['run_attempt'] == 1 and type(receipt['run_attempt']) is int
              assert receipt['mode'] == 'frozen-external-paired-v1'
              assert receipt['release_acceptance'] is False
              assert receipt['inputs'] == {
                  'expected_source_sha': SOURCE_SHA,
                  'release': False,
                  'tag': '',
                  'prerelease': True,
                  'draft': False,
                  'nix_acceptance': False,
                  'performance_acceptance': False,
                  'boot_test': True,
                  'performance_mode': 'frozen-external-paired-v1',
              }
              image = receipt['image']
              assert set(image) == {'name', 'bytes', 'sha256'}
              assert image['name'] == f'Arctic-Linux-1.2-candidate-{RUN_ID}-1-x86_64.iso'
              assert type(image['bytes']) is int and 0 < image['bytes'] < 2_000_000_000
              assert type(image['sha256']) is str and HEX64.fullmatch(image['sha256'])
              lanes = {
                  'uefi-try': ('uefi', 'try'),
                  'bios-install': ('bios', 'install'),
                  'uefi-safe': ('uefi', 'safe'),
              }
              assert isinstance(receipt['startup_results'], dict)
              assert set(receipt['startup_results']) == set(lanes)
              for lane, (firmware, mode) in lanes.items():
                  result = receipt['startup_results'][lane]
                  assert set(result) == {'firmware', 'mode', 'status', 'serial_bytes', 'serial_sha256'}
                  assert result['firmware'] == firmware and result['mode'] == mode
                  assert result['status'] == 'passed'
                  assert type(result['serial_bytes']) is int and 0 < result['serial_bytes'] <= 10_000_000
                  assert type(result['serial_sha256']) is str and HEX64.fullmatch(result['serial_sha256'])

              receipt_sha256 = hashlib.sha256(raw).hexdigest()
              print('ARCTIC-PERFORMANCE-PLAN-SHA256', receipt_sha256)
              print('ARCTIC-PERFORMANCE-PLAN-BEGIN')
              print(text, end='' if text.endswith('\n') else '\n')
              print('ARCTIC-PERFORMANCE-PLAN-END')
          PY
