name: Read safe staged diagnostics for dictation run 38836006203

on:
  push:
    branches: [codex/read-dictation-failure-388360-20261016]
    paths: [.github/dictation-failure-reader-388360.activate]

permissions:
  contents: read
  actions: read

jobs:
  read-safe-diagnostics:
    if: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.ref == 'refs/heads/codex/read-dictation-failure-388360-20261016' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the closed-vocabulary reader
        run: python3 -B -m unittest tools/dictation-failure-reader/test_read.py
      - name: Read only validated staged diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/dictation-failure-reader/read.py
          --manifest tools/dictation-failure-reader/execution-manifest.json
