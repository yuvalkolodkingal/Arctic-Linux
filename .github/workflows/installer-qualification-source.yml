name: Installer qualification source controls
on:
  pull_request:
    paths:
      - tools/installer-qualification/**
      - .github/workflows/installer-qualification-source.yml
      - .github/workflows/installer-candidate-20261009.yml
  push:
    paths:
      - tools/installer-qualification/**
      - .github/workflows/installer-qualification-source.yml
      - .github/workflows/installer-candidate-20261009.yml
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host-only PNG decoder
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-pil
      - name: Adversarial source controls
        run: |
          /usr/bin/python3 -B -m unittest discover -s tools/installer-qualification -p 'test_*.py'
          bash -n tools/installer-qualification/run-live.sh
