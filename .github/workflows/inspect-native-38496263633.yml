name: Inspect screened native 38496263633 evidence

on:
  push:
    branches: [codex/inspect-native-38496263633]
    paths: [.github/workflows/inspect-native-38496263633.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify fixed screened archive and report bounded diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re, stat, struct, subprocess, tempfile, zipfile
          from collections import Counter
          from pathlib import Path, PurePosixPath

          REPOSITORY = 'yuvalkolodkingal/Arctic-Linux'
          BRANCH = 'codex/inspect-native-38496263633'
          ARTIFACT_ID = 11864772858
          RUN_ID = 38496263633
          RUN_SHA = '9601a4e8b448840572785099c1f0764cf22b748a'
          ARCHIVE_BYTES = 58415759
          ARCHIVE_SHA256 = '9dc5172d04af296770c70c97c2a95be052ff2898fc0778d616be317d2b31682f'
          assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH
          endpoint = f'repos/{REPOSITORY}/actions/artifacts/{ARTIFACT_ID}'
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert metadata['name'] == 'native-candidate-qualification'
          assert metadata['expired'] is False
          assert metadata['size_in_bytes'] == ARCHIVE_BYTES
          assert metadata['digest'] == 'sha256:' + ARCHIVE_SHA256
          assert metadata['workflow_run']['id'] == RUN_ID
          assert metadata['workflow_run']['head_sha'] == RUN_SHA

          with tempfile.TemporaryDirectory(prefix='arctic-native-screened-') as folder:
              archive_path = Path(folder) / 'screened.zip'
              with archive_path.open('xb') as output:
                  subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=output, check=True)
              archive_raw = archive_path.read_bytes()
              assert len(archive_raw) == ARCHIVE_BYTES
              assert hashlib.sha256(archive_raw).hexdigest() == ARCHIVE_SHA256
              with zipfile.ZipFile(archive_path) as archive:
                  items = archive.infolist()
                  assert 2 <= len(items) <= 1001
                  assert len({item.filename for item in items}) == len(items)
                  total = 0
                  by_name = {}
                  for item in items:
                      path = PurePosixPath(item.filename)
                      assert item.filename == path.as_posix()
                      assert not path.is_absolute() and '..' not in path.parts and '.' not in path.parts
                      assert not item.is_dir()
                      assert (item.external_attr >> 16 & 0o170000) in (0, stat.S_IFREG)
                      assert not item.flag_bits & 1
                      assert 0 <= item.file_size <= 128 * 1024 * 1024
                      total += item.file_size
                      assert total <= 512 * 1024 * 1024
                      by_name[item.filename] = item
                  assert 'upload-screening.json' in by_name
                  screening_raw = archive.read('upload-screening.json')
                  assert len(screening_raw) <= 1024 * 1024
                  screening = json.loads(screening_raw)
                  assert set(screening) <= {'scope', 'files', 'source_formats'}
                  assert screening['scope'] == 'Owned synthetic QEMU VM only; no host desktop, VM disks or credentials'
                  assert type(screening['files']) is dict
                  assert set(screening['files']) == set(by_name) - {'upload-screening.json'}
                  redactions = 0
                  categories = Counter()
                  verified = {}
                  for name, receipt in screening['files'].items():
                      assert set(receipt) == {'original_sha256', 'uploaded_sha256', 'bytes', 'redactions'}
                      assert re.fullmatch('[0-9a-f]{64}', receipt['original_sha256'])
                      assert re.fullmatch('[0-9a-f]{64}', receipt['uploaded_sha256'])
                      assert type(receipt['bytes']) is int and receipt['bytes'] == by_name[name].file_size
                      assert type(receipt['redactions']) is int and receipt['redactions'] >= 0
                      raw = archive.read(name)
                      assert len(raw) == receipt['bytes']
                      assert hashlib.sha256(raw).hexdigest() == receipt['uploaded_sha256']
                      redactions += receipt['redactions']
                      categories[name.split('/', 1)[0] if '/' in name else 'root'] += 1
                      verified[name] = raw
                  print('ARCTIC-SCREENED-SUMMARY ' + json.dumps({
                      'artifact_id': ARTIFACT_ID, 'run_id': RUN_ID, 'run_sha': RUN_SHA,
                      'archive_bytes': ARCHIVE_BYTES, 'archive_sha256': ARCHIVE_SHA256,
                      'members': len(items), 'expanded_bytes': total,
                      'redactions': redactions, 'categories': dict(sorted(categories.items())),
                  }, sort_keys=True))

                  def strict_json(name, limit=4 * 1024 * 1024):
                      raw = verified.get(name)
                      if raw is None:
                          return None
                      assert len(raw) <= limit
                      return json.loads(raw.decode('utf-8', errors='strict'))

                  execution = strict_json('execution.json')
                  assert type(execution) is dict
                  selected_execution = {key: execution.get(key) for key in (
                      'status', 'error', 'candidate_iso_source', 'iso_bytes', 'iso_sha256',
                      'source_image_run', 'vm_base_tool_image_id', 'vm_tool_image_id',
                      'taskbar_displays',
                  ) if key in execution}
                  print('ARCTIC-EXECUTION ' + json.dumps(selected_execution, sort_keys=True))

                  stages = strict_json('native-stages.json')
                  assert type(stages) is dict
                  stage_summary = {'errors': stages.get('errors'), 'release_acceptance': stages.get('release_acceptance')}
                  for stage, result in stages.get('results', {}).items():
                      assert stage in ('live', 'installed') and type(result) is dict
                      stage_summary[stage] = {
                          'status': result.get('status'), 'stage': result.get('stage'),
                          'release_acceptance': result.get('release_acceptance'),
                          'file_count': len(result.get('files', {})),
                          'cmdline': result.get('provenance', {}).get('cmdline'),
                          'boot_id': result.get('provenance', {}).get('boot_id'),
                      }
                  print('ARCTIC-NATIVE-STAGES ' + json.dumps(stage_summary, sort_keys=True))

                  for name in ('harness/native-stop-install.json', 'harness/native-stop-boot.json'):
                      value = strict_json(name)
                      if value is not None:
                          print('ARCTIC-STOP ' + name + ' ' + json.dumps(value, sort_keys=True))

                  state = strict_json('taskbar/taskbar-state.json')
                  report = strict_json('taskbar/taskbar-report.json')
                  serial_report = strict_json('taskbar/serial-taskbar-report.json')
                  serial_proof = strict_json('taskbar/serial-taskbar-provenance.json')
                  assert all(type(value) is dict for value in (state, report, serial_report, serial_proof))
                  taskbar = {
                      'state': {key: state.get(key) for key in ('schema', 'stage', 'status', 'collector', 'release_acceptance')},
                      'report': {key: report.get(key) for key in (
                          'schema', 'stage', 'status', 'error', 'cleanup_error', 'security_error',
                          'cleanup', 'security', 'release_acceptance',
                      )},
                      'result_count': len(report.get('results', [])),
                      'serial_report_status': serial_report.get('status'),
                      'serial_report_error': serial_report.get('error'),
                      'serial_proof_stage': serial_proof.get('stage'),
                  }
                  encoded = json.dumps(taskbar, sort_keys=True)
                  assert len(encoded.encode()) <= 64 * 1024
                  print('ARCTIC-TASKBAR-SUMMARY ' + encoded)
                  cases = report.get('results', [])
                  assert type(cases) is list and len(cases) <= 24
                  print('ARCTIC-TASKBAR-PASSED-CASES ' + json.dumps([
                      {'output': case.get('output'), 'scale': case.get('scale'), 'edge': case.get('edge')}
                      for case in cases
                  ], sort_keys=True))
                  trace_raw = verified.get('taskbar/gui-trace.log')
                  assert trace_raw is not None and len(trace_raw) <= 4 * 1024 * 1024
                  trace = [json.loads(line) for line in trace_raw.decode('utf-8', errors='strict').splitlines()]
                  assert len(trace) <= 20000 and all(type(row) is dict for row in trace)
                  trace_summary = []
                  for row in trace[-30:]:
                      selected = {key: row.get(key) for key in (
                          'event', 'gate', 'error', 'output', 'scale', 'edge', 'mode', 'label', 'shown',
                          'polls', 'elapsed_seconds', 'timeout_seconds',
                      ) if key in row}
                      if 'case' in row and type(row['case']) is dict:
                          selected['case'] = {key: row['case'].get(key) for key in ('output', 'scale', 'edge')}
                      trace_summary.append(selected)
                  print('ARCTIC-TASKBAR-TRACE-TAIL ' + json.dumps(trace_summary, sort_keys=True))

                  failing_image = 'taskbar/Virtual-2-2-top-auto-covered-rest.png'
                  raw = verified.get(failing_image)
                  assert raw is not None and raw[:8] == b'\x89PNG\r\n\x1a\n'
                  # Decode this fixed synthetic failure capture with stdlib zlib;
                  # only the same bounded RGB probe arithmetic is emitted.
                  import zlib
                  width, height = struct.unpack('>II', raw[16:24])
                  assert width == 1280 and height == 720 and raw[24] == 8 and raw[25] == 2
                  position, compressed = 8, bytearray()
                  while position < len(raw):
                      length = struct.unpack('>I', raw[position:position+4])[0]
                      kind = raw[position+4:position+8]
                      data = raw[position+8:position+8+length]
                      assert position + 12 + length <= len(raw)
                      if kind == b'IDAT': compressed.extend(data)
                      position += 12 + length
                      if kind == b'IEND': break
                  decoded = zlib.decompress(bytes(compressed))
                  stride = width * 3
                  assert len(decoded) == (stride + 1) * height
                  rows, previous = [], bytes(stride)
                  for y in range(height):
                      offset = y * (stride + 1)
                      filter_type, scan = decoded[offset], bytearray(decoded[offset+1:offset+1+stride])
                      assert filter_type in range(5)
                      for x in range(stride):
                          left = scan[x-3] if x >= 3 else 0
                          up = previous[x]
                          upper_left = previous[x-3] if x >= 3 else 0
                          if filter_type == 1: scan[x] = (scan[x] + left) & 255
                          elif filter_type == 2: scan[x] = (scan[x] + up) & 255
                          elif filter_type == 3: scan[x] = (scan[x] + ((left + up) // 2)) & 255
                          elif filter_type == 4:
                              estimate = left + up - upper_left
                              distance = (abs(estimate-left), abs(estimate-up), abs(estimate-upper_left))
                              scan[x] = (scan[x] + (left if distance[0] <= distance[1] and distance[0] <= distance[2]
                                                    else up if distance[1] <= distance[2] else upper_left)) & 255
                      previous = bytes(scan); rows.append(previous)
                  center_x, center_y, radius, foot = width // 2, 44, 6, (33, 131, 79)
                  pixels = [tuple(rows[y][x*3:x*3+3])
                            for y in range(center_y-radius, center_y+radius+1)
                            for x in range(center_x-radius, center_x+radius+1)]
                  fraction = sum(max(abs(a-b) for a,b in zip(pixel, foot)) > 10 for pixel in pixels) / len(pixels)
                  row_changed = [sum(max(abs(a-b) for a,b in zip(tuple(rows[y][x*3:x*3+3]), foot)) > 10
                                     for x in range(center_x-radius, center_x+radius+1))
                                 for y in range(center_y-radius, center_y+radius+1)]
                  unique_colors = Counter(pixels)
                  print('ARCTIC-TASKBAR-FAILING-PROBE ' + json.dumps({
                      'path': failing_image, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(),
                      'width': width, 'height': height, 'non_foot_fraction': fraction,
                      'hidden_limit': 0.1, 'sampled_pixels': len(pixels), 'row_changed': row_changed,
                      'foot_pixels': unique_colors[foot], 'unique_colors': len(unique_colors),
                      'top_colors': [list(color) + [count] for color, count in unique_colors.most_common(8)],
                  }, sort_keys=True))

                  prefixes = ('ARCTIC-INSTALLED-SMOKE-EXIT', 'ARCTIC-LIVE-SMOKE-EXIT',
                              'ARCTIC-NATIVE-RUNNER-END ', 'ARCTIC-NATIVE-ERROR ',
                              'ARCTIC-TASKBAR-PORT-END ', 'ARCTIC-TASKBAR-COLLECTOR-ERROR ')
                  contains = ('ERROR:', 'FAILED', ' failed', 'Failure', 'No such file',
                              'Permission denied', 'native-functional check failed')
                  for name in ('native-harness.log', 'harness/test.log', 'harness/test-install-stage.log',
                               'harness/serial-boot.log', 'harness/taskbar-boot.log.bounded-prefix.bin'):
                      raw = verified.get(name)
                      if raw is None:
                          continue
                      assert len(raw) <= 128 * 1024 * 1024
                      text = raw.decode('utf-8', errors='strict')
                      lines = re.split('[\r\n]+', text)
                      selected = []
                      marker_counts = Counter()
                      for line in lines:
                          for prefix in prefixes:
                              if line.startswith(prefix):
                                  marker_counts[prefix] += 1
                          if line.startswith(prefixes) or any(token in line for token in contains):
                              assert len(line.encode()) <= 256 * 1024
                              selected.append(line[:16384])
                      selected = selected[-300:]
                      print('ARCTIC-TEXT-COUNTS ' + name + ' ' + json.dumps({
                          'bytes': len(raw), 'lines': len(lines), 'selected': len(selected),
                          'markers': dict(marker_counts),
                      }, sort_keys=True))
                      print('ARCTIC-SELECTED-TEXT-BEGIN ' + name + ' ' + str(len(selected)))
                      print('\n'.join(selected))
                      print('ARCTIC-SELECTED-TEXT-END ' + name)

                  image_rows = []
                  for name, raw in verified.items():
                      if not name.endswith('.png') or not (name.startswith('native-installed/') or name.startswith('taskbar/')):
                          continue
                      assert len(raw) >= 24 and raw[:8] == b'\x89PNG\r\n\x1a\n' and raw[12:16] == b'IHDR'
                      width, height = struct.unpack('>II', raw[16:24])
                      assert 1 <= width <= 8192 and 1 <= height <= 8192 and width * height <= 16_777_216
                      image_rows.append({'category': name.split('/', 1)[0], 'bytes': len(raw),
                                         'sha256': hashlib.sha256(raw).hexdigest(),
                                         'width': width, 'height': height})
                  # Hashes/dimensions provide evidence identity without publishing pixels or guest-chosen paths.
                  assert len(image_rows) <= 600
                  for index in sorted({0, max(0, len(image_rows) // 2), max(0, len(image_rows) - 1)}):
                      if image_rows:
                          print('ARCTIC-SELECTED-IMAGE ' + json.dumps(image_rows[index], sort_keys=True))
                  print('ARCTIC-SELECTED-IMAGE-COUNT ' + str(len(image_rows)))
          PY
