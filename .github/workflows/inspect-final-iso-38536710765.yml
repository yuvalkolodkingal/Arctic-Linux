name: Inspect final official VoxType ISO receipt

on:
  push:
    branches: [codex/qualification-dispatch-20261010]
    paths: [.github/workflows/inspect-final-iso-38536710765.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: ${{ github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.ref == 'refs/heads/codex/qualification-dispatch-20261010' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the fixed producer receipt and report its raw hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re, stat, subprocess, tempfile, zipfile
          from pathlib import Path

          repository = 'yuvalkolodkingal/Arctic-Linux'
          run_id = 38536710765
          source = 'a13d91118fb90b99dbbf1899fadc3e184ea213ca'
          artifact_id = 11883976414
          archive_bytes = 1700
          archive_sha256 = '8cafac8b09b21d49f764ba8c2a614c0fdb277dd3104fc7cc086003c514c246ac'
          image = {
              'name': 'Arctic-Linux-1.2-candidate-38536710765-1-x86_64.iso',
              'bytes': 1936279552,
              'sha256': 'b6bbbea37bc761d783e71417878d047bf4d1805feb60d7bbaf2cf0c5a94d05ea',
          }
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/qualification-dispatch-20261010'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          assert re.fullmatch(r'[0-9a-f]{64}', archive_sha256)
          endpoint = f'repos/{repository}/actions/artifacts/{artifact_id}'
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert metadata['id'] == artifact_id
          assert metadata['name'] == 'arctic-external-producer-receipt'
          assert metadata['expired'] is False
          assert metadata['size_in_bytes'] == archive_bytes
          assert metadata['digest'] == 'sha256:' + archive_sha256
          assert metadata['workflow_run']['id'] == run_id
          assert metadata['workflow_run']['head_sha'] == source
          with tempfile.TemporaryDirectory(prefix='arctic-final-producer-receipt-') as folder:
              archive_path = Path(folder) / 'receipt.zip'
              with archive_path.open('xb') as output:
                  subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=output, check=True)
              archive_raw = archive_path.read_bytes()
              assert len(archive_raw) == archive_bytes
              assert hashlib.sha256(archive_raw).hexdigest() == archive_sha256
              with zipfile.ZipFile(archive_path) as archive:
                  members = archive.infolist()
                  assert len(members) == 1
                  member = members[0]
                  assert member.filename == 'PERFORMANCE-PLAN.json'
                  assert not Path(member.filename).is_absolute()
                  assert '..' not in Path(member.filename).parts
                  assert stat.S_IFMT(member.external_attr >> 16) in (0, stat.S_IFREG)
                  assert 0 < member.file_size < 100_000
                  raw = archive.read(member)
          receipt = json.loads(raw)
          assert receipt['run_id'] == run_id
          assert receipt['run_attempt'] == 1
          assert receipt['source_sha'] == source
          assert receipt['mode'] == 'frozen-external-paired-v1'
          assert receipt['release_acceptance'] is False
          assert receipt['image'] == image
          assert set(receipt['startup_results']) == {'uefi-try', 'bios-install', 'uefi-safe'}
          assert all(value['status'] == 'passed' for value in receipt['startup_results'].values())
          receipt_sha256 = hashlib.sha256(raw).hexdigest()
          assert re.fullmatch(r'[0-9a-f]{64}', receipt_sha256)
          print(f'::notice title=ARCTIC_PRODUCER_RECEIPT_SHA256::{receipt_sha256}')
          PY
