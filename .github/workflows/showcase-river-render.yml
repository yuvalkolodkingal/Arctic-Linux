name: Render River showcase candidate

on:
  push:
    branches:
      - codex/showcase-river-production
    paths:
      - .github/workflows/showcase-river-render.yml
      - showcase/**
  workflow_dispatch:

permissions:
  # GitHub hides draft releases from a read-scoped workflow token.
  # This workflow runs only on a trusted branch push or manual dispatch.
  contents: write

concurrency:
  group: showcase-river-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Install integrity-locked HyperFrames dependencies
        working-directory: showcase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Resolve the current direct-VoxType River master for private rendering
        id: voice
        run: |
          python showcase/revision-2026-10-12/resolve-voice.py \
            --receipt showcase/revision-2026-10-12/voice-timing.json \
            --purpose private-render \
            --github-output "$GITHUB_OUTPUT"

      - name: Select runner browser
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          printf 'HYPERFRAMES_BROWSER_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Download and verify River master
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.voice.outputs.source_tag }}
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
          MASTER_BYTES: ${{ steps.voice.outputs.master_bytes }}
          MASTER_SHA256: ${{ steps.voice.outputs.master_sha256 }}
        run: |
          mkdir -p showcase/audio showcase/renders/validation
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MASTER_ASSET" \
            --dir showcase/audio
          test "$(stat -c %s "showcase/audio/$MASTER_ASSET")" = "$MASTER_BYTES"
          mv -f "showcase/audio/$MASTER_ASSET" showcase/audio/narration.mp3
          printf '%s  %s\n' "$MASTER_SHA256" showcase/audio/narration.mp3 | sha256sum --check -

      - name: Build current evidence composition
        run: |
          python -m py_compile showcase/build-composition.py showcase/prepare-assets.py showcase/finalize-video.py \
            showcase/capture_contracts.py showcase/voice_receipt.py showcase/revision-2026-10-12/resolve-voice.py \
            showcase/revision-2026-10-12/assemble-river-segments.py \
            showcase/revision-2026-10-12/verify-river-audio.py
          python -m unittest showcase/test_capture_contracts.py showcase/test_voice_receipt.py \
            showcase/test_asset_integrity.py showcase/test_supply_chain.py -v
          python showcase/prepare-assets.py
          python showcase/build-composition.py

      - name: Run strict HyperFrames checks
        working-directory: showcase
        run: npm run check -- --samples 38 --strict

      - name: Render 1080p candidate
        working-directory: showcase
        run: |
          npm run render -- \
            --output renders/Arctic-Linux-Showcase-River-1080p.mp4 \
            --quality high \
            --fps 30
          python finalize-video.py renders/Arctic-Linux-Showcase-River-1080p.mp4

      - name: Decode and validate final media
        env:
          MASTER_ASSET: ${{ steps.voice.outputs.master_asset }}
          MASTER_BYTES: ${{ steps.voice.outputs.master_bytes }}
          MASTER_SHA256: ${{ steps.voice.outputs.master_sha256 }}
          MASTER_DURATION: ${{ steps.voice.outputs.master_duration }}
        run: |
          ffmpeg -hide_banner -loglevel error \
            -i showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4 \
            -f null -
          ffprobe -v error -show_format -show_streams -of json \
            showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4 \
            > showcase/renders/validation/ffprobe.json
          ffmpeg -hide_banner -loglevel error \
            -i showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4 \
            -map 0:s:0 -f srt showcase/renders/validation/muxed-captions.srt
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def cue_texts(path):
              blocks = [block for block in re.split(r"\r?\n\s*\r?\n", path.read_text().strip()) if block]
              cues = []
              for block in blocks:
                  lines = block.splitlines()
                  assert len(lines) >= 3 and "-->" in lines[1], block
                  cues.append("\n".join(lines[2:]))
              return cues

          video = Path("showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4")
          probe = json.loads(Path("showcase/renders/validation/ffprobe.json").read_text())
          streams = probe["streams"]
          visual = next(stream for stream in streams if stream["codec_type"] == "video")
          audio = next(stream for stream in streams if stream["codec_type"] == "audio")
          subtitle = next(stream for stream in streams if stream["codec_type"] == "subtitle")
          duration = float(probe["format"]["duration"])
          assert visual["codec_name"] == "h264", visual
          assert (visual["width"], visual["height"]) == (1920, 1080), visual
          assert visual["avg_frame_rate"] == "30/1", visual
          assert audio["codec_name"] == "aac", audio
          assert subtitle["codec_name"] == "mov_text", subtitle
          source_cues = cue_texts(Path("showcase/captions.srt"))
          muxed_cues = cue_texts(Path("showcase/renders/validation/muxed-captions.srt"))
          assert len(source_cues) == len(muxed_cues) == 130
          assert muxed_cues == source_cues
          expected_duration = float(os.environ["MASTER_DURATION"])
          assert abs(duration - expected_duration) <= 0.08, duration
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          receipt = {
              "source_commit": "${{ github.sha }}",
              "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "video": {
                  "path": video.name,
                  "bytes": video.stat().st_size,
                  "sha256": digest,
                  "duration_seconds": duration,
                  "width": visual["width"],
                  "height": visual["height"],
                  "frame_rate": visual["avg_frame_rate"],
                  "video_codec": visual["codec_name"],
                  "audio_codec": audio["codec_name"],
                  "subtitle_codec": subtitle["codec_name"],
                  "subtitle_cues": len(muxed_cues),
              },
              "full_decode_errors": 0,
              "voice_master": {
                  "asset": os.environ["MASTER_ASSET"],
                  "bytes": int(os.environ["MASTER_BYTES"]),
                  "sha256": os.environ["MASTER_SHA256"],
                  "duration_seconds": expected_duration,
              },
              "published": False,
          }
          Path("showcase/renders/validation/render-validation.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          print(json.dumps(receipt, sort_keys=True))
          timing = json.loads(Path("showcase/timing.json").read_text())
          wanted = {"intro", "files", "dictationsetup", "dictationrecord", "dictationrecovery", "winter", "updates", "outro"}
          frames = [f"{min(float(scene['start']) + 0.5, expected_duration - 0.5):.3f}\t{scene['id']}"
                    for scene in timing["scenes"] if scene["id"] in wanted]
          assert len(frames) == len(wanted), frames
          Path("showcase/renders/validation/frames.tsv").write_text("\n".join(frames) + "\n")
          PY
          while IFS=$'\t' read -r second label; do
            ffmpeg -hide_banner -loglevel error -ss "$second" \
              -i showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4 \
              -frames:v 1 "showcase/renders/validation/frame-${label}.png"
          done < showcase/renders/validation/frames.tsv

      - name: Upload reviewed candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Arctic-Linux-Showcase-River-1080p-candidate
          path: |
            showcase/renders/Arctic-Linux-Showcase-River-1080p.mp4
            showcase/renders/validation/
            showcase/captions.srt
            showcase/captions.vtt
            showcase/chapters.txt
            showcase/timing.json
            showcase/asset-provenance.json
            showcase/revision-2026-10-12/alignment-provenance.json
            showcase/revision-2026-10-12/voice-timing.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
