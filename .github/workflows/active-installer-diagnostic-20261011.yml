name: Candidate active installer readiness and privacy diagnostics

on:
  push:
    branches: [codex/qualification-dispatch-20261010]
    paths: [.github/qualification-20261011.active-diagnostic]

permissions:
  contents: read
  actions: read

jobs:
  installer:
    if: github.repository == 'yuvalkolodkingal/Arctic-Linux' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
        with:
          path: execution
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed activation and exact diagnostic composition
        id: image
        working-directory: execution
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,os,re,subprocess
          from pathlib import Path
          marker='.github/qualification-20261011.active-diagnostic'
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          reviewed=Path(marker).read_text().strip()
          assert re.fullmatch('[0-9a-f]{40}',reviewed)
          assert event['before']==reviewed and event['after']==os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==reviewed
          assert subprocess.check_output(['git','diff','--name-only',reviewed,'HEAD'],text=True).splitlines()==[marker]
          here=Path('tools/final-active-installer-diagnostic-20261011').resolve()
          spec=importlib.util.spec_from_file_location('reviewed_active_diagnostic',here/'composition.py')
          c=importlib.util.module_from_spec(spec);spec.loader.exec_module(c)
          manifest=json.loads((here/'execution-manifest.json').read_bytes())
          c.checked(manifest,ready=True)
          source=manifest['image']['source_sha']
          assert re.fullmatch('[0-9a-f]{40}',source)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('source='+source+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.source }}
          path: source
          persist-credentials: false
      - name: Install host-only physical evidence decoder
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-pil
          /usr/bin/python3 -B -c 'from PIL import Image; print("Physical evidence decoder available")'
      - name: Fetch verified retained candidate
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 15
        run: |
          mkdir "$RUNNER_TEMP/arctic-active-diagnostic"
          /usr/bin/python3 -B execution/tools/native-functional/fetch-image.py --manifest execution/tools/final-active-installer-diagnostic-20261011/execution-manifest.json --out "$RUNNER_TEMP/arctic-active-diagnostic/inputs"
      - name: Original active installation with additive readiness observations
        timeout-minutes: 130
        run: |
          /usr/bin/python3 -B execution/tools/final-active-installer-diagnostic-20261011/composition.py --active-profile --source "$GITHUB_WORKSPACE/source" --inputs "$RUNNER_TEMP/arctic-active-diagnostic/inputs" --manifest "$GITHUB_WORKSPACE/execution/tools/final-active-installer-diagnostic-20261011/execution-manifest.json" --evidence "$RUNNER_TEMP/arctic-active-diagnostic/evidence"
      - name: Screen bounded original VM evidence
        id: strict_screen
        if: always()
        run: |
          /usr/bin/python3 -B execution/tools/native-functional/screen-evidence.py --preserve-original --source "$RUNNER_TEMP/arctic-active-diagnostic/evidence" --out "$RUNNER_TEMP/arctic-active-diagnostic/screened"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-active-installer-readiness-privacy
          path: ${{ runner.temp }}/arctic-active-diagnostic/screened/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failure-only partial originals with same-Match diagnostics
        id: partial_diagnostic
        if: always() && steps.strict_screen.outcome == 'failure'
        run: |
          /usr/bin/python3 -B execution/tools/final-active-installer-diagnostic-20261011/privacy-entry.py --profile active --source "$RUNNER_TEMP/arctic-active-diagnostic/evidence" --out "$RUNNER_TEMP/arctic-active-diagnostic/diagnostic-partial"
      - uses: actions/upload-artifact@v4
        if: always() && steps.strict_screen.outcome == 'failure' && steps.partial_diagnostic.outcome == 'success'
        with:
          name: candidate-active-installer-readiness-privacy-diagnostic-partial
          path: ${{ runner.temp }}/arctic-active-diagnostic/diagnostic-partial/
          if-no-files-found: error
          retention-days: 14
