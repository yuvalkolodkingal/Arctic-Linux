id = "neovim"
name = "Neovim"
summary = "Keyboard-driven text editor for the terminal."
category = "editor"
default = false
tile = "neovim"
icon = "prompt"
in_live_image = false
gpu = false
requires = []
conflicts = []

[[install]]
# Fedora 44: neovim 0.12 (8.6 MB + runtime deps)
method = "dnf"
packages = ["neovim"]
download_mb = 12

[defaults]
desktop_id = "nvim.desktop"
role = "editor"
command = "{terminal} -e nvim"
