id = "featherpad"
name = "FeatherPad"
summary = "Lightweight text editor with tabs, search and highlighting."
category = "editor"
role = "text editor"
default = true
tile = "featherpad"
icon = "file"
in_live_image = true
gpu = true
requires = []
conflicts = []

[[install]]
# Fedora 44: Qt 6 is already part of the Arctic desktop.
method = "dnf"
packages = ["featherpad"]
download_mb = 1

[defaults]
desktop_id = "featherpad.desktop"
role = "editor"
command = "featherpad"
mime = [
  "text/plain",
  "text/markdown",
  "text/x-python",
  "text/x-csrc",
  "text/x-shellscript",
  "application/json",
  "application/toml",
]
