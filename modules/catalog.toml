# Download size (MB) of each shared download, counted once per install: the Flatpak runtimes
# (Flathub API /api/v2/summary/<runtime> on 2026-09-27) and "akmods", the tools that build a
# driver for the kernel (akmods, kernel-devel, gcc, rpm-build; about 550 MB on a bare Fedora 44
# container on 2026-09-27, roughly half that on top of the live image). Optional Zen pulls
# freedesktop 25.08, Zed the freedesktop 26.08 SDK and Collabora KDE 6.10; every
# other GNOME/KDE runtime costs 400+ MB the first time, which is why small GNOME apps whose
# Fedora package is current install with dnf first. Not counted: org.freedesktop.Platform.GL.default
# (~150 MB per freedesktop branch) and codecs-extra.
[runtimes]
"akmods" = 300
"org.freedesktop.Platform//24.08" = 269
"org.freedesktop.Platform//25.08" = 259
"org.freedesktop.Platform//26.08" = 281
"org.freedesktop.Sdk//25.08" = 609
"org.freedesktop.Sdk//26.08" = 656
"org.gnome.Platform//49" = 419
"org.gnome.Platform//50" = 420
"org.gnome.Platform//51" = 432
"org.kde.Platform//5.15-25.08" = 367
"org.kde.Platform//6.10" = 392
"org.kde.Platform//6.11" = 410
