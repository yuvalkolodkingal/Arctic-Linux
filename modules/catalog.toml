# Arctic Linux app catalog — catalog-wide data.
#
# Categories are the installer's app picker sections, in picker order: the design's seven core
# sections (design bundle.js CATEGORIES + components/AppChecklist) first, then the optional
# groups; Extras (last) now holds the utilities. `modules` fixes the order of the tiles inside
# each section (the first ticked app in that order wins a MIME type); every visible module must be listed in
# exactly one category. `collapsed = true` sections start folded in the picker ("More apps":
# nothing in them is ticked by default) and cannot be required.
# Each module lives in modules/<category>/<id>/module.toml; hidden, always-installed modules in
# modules/_system/<id>/module.toml. Profiles and the UI only ever reference module ids.

# The drivers category is special (hardware = true): its modules carry [[detect]] rules and are
# offered, ticked, only when a matching device is found on the computer; with none found the
# section isn't shown at all.

# Pinned nixpkgs for Nix-installed modules: head of nixos-26.05 on 2026-09-27
# (git ls-remote https://github.com/NixOS/nixpkgs refs/heads/nixos-26.05).
nixpkgs = "github:NixOS/nixpkgs/5e2305d577ca00acbba631b05cb1094d172b29f3"

[[category]]
id = "drivers"
name = "Drivers"
choice = "any"
hardware = true
note = "Found on this computer. These come from RPM Fusion and aren’t open source."
role = "driver"
modules = ["nvidia", "nvidia-580xx", "broadcom-wl", "intel-media", "amd-video"]

