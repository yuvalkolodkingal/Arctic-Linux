id = "gthumb"
name = "gThumb"
summary = "Browse, view and touch up photos."
category = "photos"
role = "image viewer"
default = false
tile = "gthumb"
icon = "image"
in_live_image = false
gpu = true
requires = []
conflicts = []

[[install]]
# Fedora 44: gthumb 3.12.11.
method = "dnf"
packages = ["gthumb"]
download_mb = 8

[[install]]
method = "flatpak"
remote = "flathub"
ref = "org.gnome.gThumb"
runtime = "org.gnome.Platform//50"
verified = false
download_mb = 14

[defaults]
desktop_id = "org.gnome.gThumb.desktop"
mime = [
  "image/png",
  "image/jpeg",
  "image/gif",
  "image/webp",
  "image/avif",
  "image/heif",
  "image/jxl",
  "image/tiff",
  "image/bmp",
  "image/svg+xml",
]
