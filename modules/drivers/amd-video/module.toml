# Mesa's VA-API and Vulkan video drivers built with every codec (RPM Fusion free
# mesa-va-drivers-freeworld and mesa-vulkan-drivers-freeworld, 26.2.3 for Fedora 44), in place
# of Fedora's builds, which leave out H.264, HEVC and VC-1 (rpmfusion.org/Howto/Multimedia).
# Fedora 44's Mesa has no VDPAU drivers any more, so there is nothing to swap for VDPAU.
# The freeworld builds follow Fedora's Mesa a few days late: when Fedora is ahead, the swap
# fails and the install asks whether to try again or skip (unattended: first boot).
id = "amd-video"
name = "AMD video acceleration"
short = "AMD video"
summary = "Plays and records H.264 and H.265 video on your {device} instead of the processor."
category = "drivers"
role = "video driver"
default = true
tile = "driver-media"
icon = "film"
in_live_image = false
gpu = false
requires = []
conflicts = []

# Every AMD display device (radeonsi, r600).
[[detect]]
bus = "pci"
vendor = "1002"
class = ["0300", "0380"]

[[install]]
method = "dnf"
packages = ["mesa-va-drivers-freeworld", "mesa-vulkan-drivers-freeworld"]
repos = ["rpmfusion-free"]
swap = ["mesa-va-drivers=mesa-va-drivers-freeworld", "mesa-vulkan-drivers=mesa-vulkan-drivers-freeworld"]
download_mb = 87
