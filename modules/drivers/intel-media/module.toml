device_max = "4e7f"

[[detect]] # Tiger Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "9a00"
device_max = "9aff"

[[detect]] # Rocket Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
