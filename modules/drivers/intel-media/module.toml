[[install]]
# The swap runs only when Fedora's package is installed (rpm -q); intel-media-driver is
# installed either way.
method = "dnf"
packages = ["intel-media-driver"]
repos = ["rpmfusion-free", "rpmfusion-nonfree"]
swap = ["libva-intel-media-driver=intel-media-driver"]
download_mb = 8
