device_max = "8a7f"

[[detect]] # Elkhart Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "4500"
device_max = "457f"

[[detect]] # Jasper Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
