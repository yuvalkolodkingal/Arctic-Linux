# Intel's VA-API video driver with every codec (RPM Fusion nonfree intel-media-driver
# 26.1.5 for Fedora 44), in place of Fedora's libva-intel-media-driver, which leaves out the
# patent-encumbered ones (H.264, HEVC and VC-1 on some parts). It drives Broadwell (Gen8) and
# every later Intel GPU; older ones use i965 (libva-intel-driver) and are not listed.
id = "intel-media"
name = "Intel video acceleration"
short = "Intel video"
summary = "Plays and records H.264 and H.265 video on your {device} instead of the processor."
category = "drivers"
role = "video driver"
default = true
tile = "driver-media"
icon = "film"
in_live_image = false
gpu = false
requires = []
conflicts = []

# Display (0300) and display-other (0380) devices of vendor 8086, by generation (device ids
# from the Linux i915/xe PCI id tables and pci.ids).
[[detect]] # Broadwell
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "1600"
device_max = "163f"

[[detect]] # Skylake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "1900"
device_max = "193f"

[[detect]] # Broxton, Apollo Lake, Gemini Lake, Amber Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
devices = ["0a84", "1a84", "1a85", "5a84", "5a85", "3184", "3185", "87c0", "87ca"]

[[detect]] # Kaby Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "5900"
device_max = "593f"

[[detect]] # Coffee Lake, Whiskey Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "3e90"
device_max = "3ebf"

[[detect]] # Comet Lake
bus = "pci"
vendor = "8086"
class = ["0300", "0380"]
device_min = "9b00"
device_max = "9bff"

[[detect]] # Ice Lake
