id = "gpu-screen-recorder"
name = "GPU Screen Recorder"
summary = "Record gameplay with almost no slowdown."
category = "recording"
role = "screen recorder"
default = false
tile = "gpu-screen-recorder"
icon = "record"
in_live_image = false
gpu = true
requires = []
conflicts = []

[[install]]
method = "flatpak"
remote = "flathub"
ref = "com.dec05eba.gpu_screen_recorder"
# Flathub still builds this app on freedesktop 24.08 (checked 2026-09-28), which is
# end-of-life: flatpak warns about it and pulls a 269 MB runtime no other app uses.
# Move to the new runtime when Flathub does (catalog_test TestFlatpakRuntimesAreCurrent).
runtime = "org.freedesktop.Platform//24.08"
verified = true
download_mb = 12
