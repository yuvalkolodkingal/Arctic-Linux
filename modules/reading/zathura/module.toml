id = "zathura"
name = "Zathura"
summary = "Minimal, keyboard-driven PDF reader."
category = "reading"
role = "PDF reader"
default = false
tile = "zathura"
icon = "file"
in_live_image = false
gpu = true
requires = []
conflicts = []

[[install]]
# Fedora 44: zathura 2026.07.18.
method = "dnf"
packages = ["zathura", "zathura-pdf-mupdf"]
download_mb = 41

[[install]]
method = "flatpak"
remote = "flathub"
ref = "org.pwmt.zathura"
runtime = "org.gnome.Platform//50"
verified = true
download_mb = 22

[defaults]
desktop_id = "org.pwmt.zathura.desktop"
mime = ["application/pdf"]
