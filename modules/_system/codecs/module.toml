# Downloaded at install time (not in the live image).
id = "codecs"
name = "Media codecs"
summary = "RPM Fusion repositories, full ffmpeg and OpenH264."
category = "system"
hidden = true
always = true
in_live_image = false
gpu = false
requires = []
conflicts = []

[[install]]
# Keys come from distribution-gpg-keys; never --nogpgcheck.
method = "dnf"
packages = ["openh264", "mozilla-openh264", "gstreamer1-plugin-openh264"]
repos = ["rpmfusion-free", "rpmfusion-nonfree"]
swap = ["ffmpeg-free=ffmpeg"]
download_mb = 40
