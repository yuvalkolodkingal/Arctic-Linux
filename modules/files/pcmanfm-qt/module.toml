id = "pcmanfm-qt"
name = "PCManFM-Qt"
summary = "Very light windowed file manager."
category = "files"
default = false
tile = "pcmanfm-qt"
icon = "folder"
in_live_image = false
gpu = true
requires = []
conflicts = []

[[install]]
# Fedora 44: pcmanfm-qt 2.4.1 (Qt 6 is already in the image).
method = "dnf"
packages = ["pcmanfm-qt"]
download_mb = 3

[defaults]
desktop_id = "pcmanfm-qt.desktop"
role = "files"
command = "pcmanfm-qt"
mime = ["inode/directory"]
