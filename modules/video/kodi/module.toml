id = "kodi"
name = "Kodi"
summary = "Media centre for your TV, films and music."
category = "video"
role = "media centre"
default = false
tile = "kodi"
icon = "home"
in_live_image = false
gpu = true
requires = []
conflicts = []

[[install]]
# RPM Fusion free: kodi 22.0 (Flathub still has 21.3).
method = "dnf"
packages = ["kodi"]
repos = ["rpmfusion-free"]
download_mb = 39

[[install]]
method = "flatpak"
remote = "flathub"
ref = "tv.kodi.Kodi"
# Flathub still builds this app on freedesktop 24.08 (checked 2026-09-28), which is
# end-of-life: flatpak warns about it and pulls a 269 MB runtime no other app uses.
# Move to the new runtime when Flathub does (catalog_test TestFlatpakRuntimesAreCurrent).
runtime = "org.freedesktop.Platform//24.08"
verified = true
download_mb = 298
