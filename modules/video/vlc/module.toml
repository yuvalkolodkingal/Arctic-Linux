# In the live image, including vlc-plugins-freeworld (the ISO build enables RPM Fusion).
id = "vlc"
name = "VLC"
summary = "Plays almost any video or audio file."
category = "video"
default = true
tile = "vlc"
icon = "play"
in_live_image = true
gpu = true
requires = []
conflicts = []

[[install]]
# vlc from Fedora + vlc-plugins-freeworld from RPM Fusion free (3.0.23 for F44).
method = "dnf"
packages = ["vlc", "vlc-plugins-freeworld"]
remove = ["vlc", "vlc-gui-qt", "vlc-plugins-freeworld"]
repos = ["rpmfusion-free"]
download_mb = 30

[defaults]
desktop_id = "vlc.desktop"
mime = [
  "video/mp4",
  "video/x-matroska",
  "video/webm",
  "video/quicktime",
  "video/x-msvideo",
  "audio/mpeg",
  "audio/flac",
  "audio/ogg",
]
