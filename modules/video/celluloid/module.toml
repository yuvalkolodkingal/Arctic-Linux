id = "celluloid"
name = "Celluloid"
summary = "Simple player built on mpv."
category = "video"
default = true
tile = "celluloid"
icon = "film"
in_live_image = true
gpu = true
requires = []
conflicts = []

[[install]]
# Fedora 44: celluloid 0.30, the same release as Flathub; avoids the 432 MB GNOME 51 runtime.
# The RPM ships the same io.github.celluloid_player.Celluloid.desktop.
method = "dnf"
packages = ["celluloid"]
download_mb = 15

[[install]]
method = "flatpak"
remote = "flathub"
ref = "io.github.celluloid_player.Celluloid"
runtime = "org.gnome.Platform//51"
verified = true
download_mb = 66

[defaults]
desktop_id = "io.github.celluloid_player.Celluloid.desktop"
mime = [
  "video/mp4",
  "video/x-matroska",
  "video/webm",
  "video/quicktime",
  "video/x-msvideo",
  "audio/mpeg",
  "audio/flac",
  "audio/ogg",
]
