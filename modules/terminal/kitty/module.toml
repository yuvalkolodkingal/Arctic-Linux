# In the live image (arctic-desktop requires it).
id = "kitty"
name = "kitty"
summary = "Fast, GPU-drawn terminal."
category = "terminal"
default = true
tile = "kitty"
icon = "terminal"
in_live_image = true
gpu = true
requires = []
conflicts = []

[[install]]
