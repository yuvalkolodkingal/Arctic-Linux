# Arctic Linux: Mango additions for the live USB session (package arctic-live).
# Sourced last from liveuser's ~/.config/mango/config.conf (written by livesys-arctic).

# Try mode: nothing to do (the shell shows the welcome card). Install mode: the installer,
# full screen.
exec-once=/usr/libexec/arctic/live-session

# The installer always takes the whole screen and cannot be tiled away.
windowrule=isfullscreen:1,appid:^org\.arcticlinux\.Installer$

# The installer UI (installer-ui/, Quickshell) is a full-screen layer surface in the
# "arctic-installer" namespace with exclusive keyboard focus: no open animation, no shadow,
# and no backdrop blur (the desktop blurs layers, which here would cover the whole screen).
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:^arctic-installer$
