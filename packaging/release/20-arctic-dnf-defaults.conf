# From Fedora's fedora-release-common 44-18 (MIT): Fedora's dnf5 defaults.
[main]
best=False
pkg_gpgcheck=True
skip_if_unavailable=True

# Arctic Linux.
# Downloads: ten packages at a time instead of three.
max_parallel_downloads=10
# Kernels: two instead of three. The one that is running (it starts, so it is the fallback in
# the boot menu) and the newest; each new kernel replaces the older spare.
installonly_limit=2
