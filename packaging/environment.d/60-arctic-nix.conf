# User systemd/D-Bus activations get the same profiles as the login session.
PATH=${HOME}/.local/state/nix/profiles/arctic/bin:${HOME}/.local/state/nix/profile/bin:${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH:-/usr/local/bin:/usr/bin}
XDG_DATA_DIRS=${HOME}/.local/state/nix/profiles/arctic/share:${HOME}/.local/state/nix/profile/share:${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
