# Arctic Linux — Qt 5 and Qt 6 apps started by systemd or D-Bus take the active theme's colours,
# fonts and icons from qt5ct / qt6ct (both answer to "qt6ct"; docs/BUILD-SPEC.md "App theming").
# Apps started from the desktop get the same from Mango (mango/arctic/look.conf). This file is
# read after ~/.config/environment.d/10-arctic.conf, so it also replaces the
# QT_QPA_PLATFORMTHEME=xdgdesktopportal that copies from Arctic 0.1 still have. To choose
# another value, put it in a file of yours that sorts after this one, e.g.
# ~/.config/environment.d/60-qt.conf.
QT_QPA_PLATFORMTHEME=qt6ct
