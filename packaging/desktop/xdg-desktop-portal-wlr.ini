# Arctic Linux: the screen-share picker in Mango sessions (xdg-desktop-portal-wlr(5)). Mango sets
# XDG_CURRENT_DESKTOP=mango, so this file (/etc/xdg/xdg-desktop-portal-wlr/mango) is read there
# and not by other compositors. Copy it to ~/.config/xdg-desktop-portal-wlr/mango to change it.
[screencast]
chooser_type=simple
chooser_cmd=/usr/libexec/arctic/arctic-share-picker
max_fps=60
