# Arctic Linux (arctic-desktop-config): the Mango session starts the apps that asked to start
# when you log in (~/.config/autostart, /etc/xdg/autostart), like other desktops do.
# systemd-xdg-autostart-generator turns those entries into units and honours Hidden,
# OnlyShowIn/NotShowIn (Mango sets XDG_CURRENT_DESKTOP=mango) and TryExec. The target refuses a
# manual start (RefuseManualStart=yes), so the session target pulls it in. Mango starts
# mango-session.target only in a real session: the login screen's Mango has no session bus.
# Installed as /usr/lib/systemd/user/mango-session.target.d/arctic-autostart.conf.
[Unit]
Wants=xdg-desktop-autostart.target
