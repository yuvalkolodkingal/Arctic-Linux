# Arctic Linux (arctic-desktop-config): not in the Mango session. Arctic starts this itself
# (nm-applet: `arctic-session nm-applet`) or has something else for it (blueman-applet starts
# on demand over D-Bus; the geoclue demo agent is only geoclue's example).
# Installed as a drop-in for the unit systemd-xdg-autostart-generator makes from the entry,
# /usr/lib/systemd/user/app-<entry>@autostart.service.d/arctic.conf.
[Unit]
ConditionEnvironment=!XDG_CURRENT_DESKTOP=mango
