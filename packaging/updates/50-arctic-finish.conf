# Arctic Linux: leave the offline-update boot without asking for the disk passphrase again.
# Installed as /usr/lib/systemd/system/dnf5-offline-transaction.service.d/50-arctic-finish.conf
# by arctic-desktop-config (packaging/updates/README.md, "Leaving the update boot").
#
# dnf5 would restart the computer itself when the updates are in. It is told not to, and
# arctic-update-finish decides instead: `systemctl soft-reboot` when only programs changed
# (the kernel keeps running and the encrypted disk stays unlocked), a full restart when a
# kernel, driver or firmware changed, power off when that was asked for.
# A failed transaction still ends in dnf5-offline-transaction-cleanup.service (a full restart).
[Service]
Environment=DNF_SYSTEM_UPGRADE_NO_REBOOT=1
# "-": never keep the updates from being installed.
ExecStartPre=-/usr/libexec/arctic/arctic-update-finish prepare
ExecStartPost=/usr/libexec/arctic/arctic-update-finish finish
