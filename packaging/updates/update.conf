# Arctic Linux automatic updates (arctic-update, see `arctic-update help`).
# Updates are downloaded in the background and installed the next time the computer restarts,
# before the desktop starts: nothing changes while you work. The next daily check uses what's
# here; `arctic-update auto on|off|download-only` and `arctic-update metered skip|allow` edit it.

# AUTO: what the daily check does.
#   download-and-install-on-reboot  download updates and install them at the next restart
#   download-only                   download them; install with `arctic-update apply`
#   off                             don't check (`arctic-update now` still works)
AUTO=download-and-install-on-reboot

# METERED: on a metered connection (a phone hotspot, a capped plan; NetworkManager decides,
# or set it in the connection's settings).
#   skip   wait for a connection that isn't metered
#   allow  download anyway
METERED=skip
