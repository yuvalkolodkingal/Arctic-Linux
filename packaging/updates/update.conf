# Arctic Linux automatic updates (arctic-update, see `arctic-update help`).
# Updates are plain dnf: once a day they are downloaded and installed in the background, while
# the computer runs. A restart is only suggested when a kernel, driver or firmware changed, and
# never happens by itself. `arctic-update auto on|off|download-only`,
# `arctic-update install now|restart` and `arctic-update metered skip|allow` edit this file.

# AUTO: what the daily check does.
#   download-and-install-on-reboot  download updates and install them (the name is from when
#                                   they were installed at a restart; INSTALL says when)
#   download-only                   download them; install with `arctic-update apply`
#   off                             don't check (`arctic-update now` still works)
AUTO=download-and-install-on-reboot

# INSTALL: when updates are installed.
#   now      while the computer runs, like `sudo dnf upgrade` (the default)
#   restart  the next time the computer starts, before the desktop (Arctic Linux up to 1.2.2)
INSTALL=now

# METERED: on a metered connection (a phone hotspot, a capped plan; NetworkManager decides,
# or set it in the connection's settings).
#   skip   wait for a connection that isn't metered
#   allow  download anyway
METERED=skip
