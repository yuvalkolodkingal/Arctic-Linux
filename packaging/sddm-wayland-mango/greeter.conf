# Arctic Linux: Mango configuration for the SDDM login screen (sddm-wayland-mango).
# Only the greeter runs here. No key bindings (mango keeps only Ctrl+Alt+F1…F12 for VT
# switching), no exec/exec-once, no effects.

animations=0
layer_animations=0
blur=0
blur_layer=0
shadows=0
layer_shadows=0
borderpx=0
gappih=0
gappiv=0
gappoh=0
gappov=0
focus_on_activate=1
cursor_theme=Adwaita
cursor_size=24

# Polar night ground behind the greeter while it starts.
rootcolor=0x0c1015ff

# If the greeter ever runs as an xdg-shell window instead of a layer surface
# (QT_WAYLAND_SHELL_INTEGRATION=xdg-shell), keep it full screen.
windowrule=isfullscreen:1,appid:^sddm-greeter

# Keyboard layout picked in the installer (written by arcticd; optional).
source-optional=/etc/arctic/sddm-keyboard.conf
