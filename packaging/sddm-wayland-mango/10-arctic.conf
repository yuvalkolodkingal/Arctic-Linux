# Arctic Linux: SDDM greeter on Mango (package sddm-wayland-mango).
# /usr/lib/sddm/sddm.conf.d is read first; /etc/sddm.conf.d and /etc/sddm.conf override it.

[General]
DisplayServer=wayland
# The greeter's windows become wlr-layer-shell surfaces (layer-shell-qt); mango gives
# on-demand layers keyboard focus as soon as they map.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
InputMethod=

[Wayland]
CompositorCommand=/usr/libexec/arctic/sddm-compositor-mango

[Theme]
Current=arctic
CursorTheme=Adwaita

[Users]
# liveuser and new accounts
MinimumUid=1000
