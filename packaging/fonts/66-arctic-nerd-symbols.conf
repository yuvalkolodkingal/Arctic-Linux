<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Arctic Linux (arctic-fonts-symbols): the Nerd Font symbols after the code font, so yazi,
     eza (with icons on) and prompts get their icons without a patched font. Appended weakly: a glyph the
     code font has is always drawn from the code font. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>
</fontconfig>
