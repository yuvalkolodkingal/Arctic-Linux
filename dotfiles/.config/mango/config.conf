# Arctic Linux — Mango entry point (~/.config/mango/config.conf)
#
# Mango reads only this file (it does not merge /etc/mango/config.conf), so it
# pulls everything in with source=. Order matters: later files win.
#
#   arctic/*.conf                      the Arctic desktop (look, input, keys, rules, autostart)
#   ~/.config/arctic/current/…         colours of the active theme (Winter / Polar night), switched by arctic-theme
#   /etc/arctic/mango/keyboard.conf    written by the installer (the keyboard layout you picked)
#   ~/.config/arctic/motion.conf       reduced-motion switch, written by arctic-motion
#   user.conf                          your own overrides — put changes there, not here

source=~/.config/mango/arctic/look.conf
source=~/.config/arctic/current/mango-colors.conf
source=~/.config/mango/arctic/input.conf
source-optional=/etc/arctic/mango/keyboard.conf
source=~/.config/mango/arctic/apps.conf
source=~/.config/mango/arctic/binds.conf
source=~/.config/mango/arctic/rules.conf
source=~/.config/mango/arctic/autostart.conf
source-optional=~/.config/arctic/motion.conf
source-optional=~/.config/mango/user.conf
