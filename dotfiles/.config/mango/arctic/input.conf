# Arctic Linux — input. The installer writes the keyboard layout you picked to
# /etc/arctic/mango/keyboard.conf (sourced right after this file), so the layout here is only the fallback.

xkb_rules_layout=us
repeat_rate=30
repeat_delay=300
numlockon=0

# Touchpad: tap to click and natural scrolling, like most laptops people come from.
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_middle_button_emulation=1
mouse_natural_scrolling=0
