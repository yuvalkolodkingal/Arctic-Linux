# Arctic Linux — Mango look. Spec: design components/WindowFrame, brand book "Motion" and "Elevation and frost".
# Colours live in ~/.config/arctic/current/mango-colors.conf (generated from the tokens).

# Tiled window chrome: 2px border (border-window), radius-md 10px, 8px gaps (space-2) inside and out.
borderpx=2
border_radius=10
no_radius_when_single=0
no_border_when_single=0
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0
focused_opacity=1.0
unfocused_opacity=1.0

# Five workspaces, as on the top bar (1–5).
tag_num=5

# Elevation: flat tiles; floating windows get shadow-lg; layer shadows for menus/notifications.
shadows=1
shadow_only_floating=1
layer_shadows=1
shadows_size=24
shadows_blur=48
shadows_position_x=0
shadows_position_y=12

# Frost: backdrop blur only on layer surfaces that float over the wallpaper — the bar
# (rules.conf keeps it off the shell's full-screen and rounded surfaces). Windows are never
# blurred (rules.conf: noblur for every window). Mango blurs layers only when blur and
# blur_layer are both on. blur-lg 28px ≈ 3 passes × radius 6.
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.95
blur_params_contrast=0.95
blur_params_saturation=1.1

# Motion: fades and short scales only — no bounces, no big slides.
#   duration-base 180ms (open, move, workspace), duration-fast 120ms (close)
#   ease-enter cubic-bezier(0,0,0.2,1) for arrivals, ease-exit (0.4,0,1,1) for departures,
#   ease-standard (0.2,0,0,1) for everything else.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
zoom_initial_ratio=0.96
zoom_end_ratio=0.98
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0
tag_animation_direction=1
animation_duration_open=180
animation_duration_move=180
animation_duration_tag=180
animation_duration_close=120
animation_duration_focus=0
animation_curve_open=0,0,0.2,1
animation_curve_move=0.2,0,0,1
animation_curve_tag=0.2,0,0,1
animation_curve_close=0.4,0,1,1
animation_curve_focus=0.2,0,0,1
animation_curve_opafadein=0,0,0.2,1
animation_curve_opafadeout=0.4,0,1,1

# Layout: master-stack tiling on every workspace.
new_is_master=0
default_mfact=0.5
default_nmaster=1
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile

# Overview (Super+O)
overviewgappi=8
overviewgappo=32

# The drop-down terminal (Super + Alt + Enter) and other scratchpad windows: 80 % of the
# screen's width, 60 % of its height, centred.
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.6

# Jump labels (Super + J) and tab-group bars (Super + Alt + arrows): Figtree, radius-sm, the
# design's spacing. Their colours are the theme's (mango-colors.conf).
jump_label_decorate_font_desc=Figtree Bold 14
jump_label_decorate_corner_radius=6
jump_label_decorate_padding_x=8
jump_label_decorate_padding_y=4
jump_label_decorate_border_width=1
group_bar_height=28
group_bar_decorate_font_desc=Figtree 10
group_bar_decorate_corner_radius=6
group_bar_decorate_padding_x=10
group_bar_decorate_padding_y=4
group_bar_decorate_border_width=1

# Focus behaviour
sloppyfocus=1
warpcursor=0
focus_on_activate=1

# A full-screen window alone doesn't keep the screen awake: a browser or terminal left full screen
# must still lock. Videos, games and presentations ask for it themselves (idle inhibit, the
# portal, org.freedesktop.ScreenSaver through arctic-screensaver), and Super + Ctrl + I does too.
idleinhibit_when_fullscreen=0

# Cursor: Adwaita at 24px (the same as GTK's cursor-theme and the login screen). Mango also
# exports XCURSOR_THEME/XCURSOR_SIZE to every app and to systemd/D-Bus activated ones.
cursor_theme=Adwaita
cursor_size=24

# Qt apps (VLC and other Qt 5/6 apps) take the active theme's colours from qt5ct/qt6ct
# (~/.config/qt5ct, ~/.config/qt6ct → ~/.config/arctic/current/qt*ct/colors/arctic.conf).
# Both plugins answer to "qt6ct". /usr/lib/environment.d/50-arctic-qt.conf (and
# ~/.config/environment.d/10-arctic.conf) set the same for D-Bus activated apps.
# The Arctic shell and the installer inherit it too; their controls take colours and fonts
# from Theme.qml, and it must stay set for the apps the launcher starts (they inherit the
# shell's environment). docs/BUILD-SPEC.md "App theming".
env=QT_QPA_PLATFORMTHEME,qt6ct
