# Arctic Linux — window and layer rules.

# ---- Layers (bar, launcher, notifications, wallpaper) --------------------
# The bar is flat against the top edge: frost blur, no shadow, no animation.
layerrule=noshadow:1,noanim:1,layer_name:waybar
# The launcher opens with a fade + small scale (duration-slow in the design, zoom here).
layerrule=animation_type_open:zoom,animation_type_close:fade,layer_name:launcher
# Wallpaper and screenshot selection must never blur, animate or cast shadows.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:wallpaper
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:selection

# ---- Dialogs and small tools float, centred --------------------------------
windowrule=isfloating:1,appid:lxqt-policykit-agent
windowrule=isfloating:1,width:720,height:480,appid:org.pulseaudio.pavucontrol
windowrule=isfloating:1,width:720,height:520,appid:nm-connection-editor
windowrule=isfloating:1,width:560,height:480,appid:blueman-manager
windowrule=isfloating:1,title:^(Open File|Save File|Open Folder|Save As).*
windowrule=isfloating:1,isglobal:1,width:480,height:270,offsetx:90,offsety:85,title:^Picture-in-Picture$

# ---- Arctic apps -------------------------------------------------------
# The installer always takes the whole screen (design: installer screens are full-screen).
windowrule=isfullscreen:1,appid:org.arcticlinux.Installer
# Keyboard cheat sheet (Super+/)
windowrule=isfloating:1,width:640,height:560,appid:org.arcticlinux.Keys
