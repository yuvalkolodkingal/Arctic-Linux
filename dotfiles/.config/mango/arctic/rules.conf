# Arctic Linux — window and layer rules.

# ---- Layers (bar, launcher, notifications, wallpaper) --------------------
# Every layer rule whose layer_name matches applies, in order, and a rule resets noblur,
# noanim and noshadow to 0 unless it sets them. layer_name is a regex matched anywhere in
# the namespace, so each one is anchored: "launcher" alone would also match arctic-launcher
# and undo its rule. Layers without a rule (mako's notifications) get blur and shadow.
#
# The shell's bar is flat against the top edge: frost blur, no shadow, no animation.
layerrule=noshadow:1,noanim:1,layer_name:^arctic-bar$
# The shell's other surfaces animate themselves (fade + short scale, reduced-motion aware).
# They are full-screen (frame, scrim behind popovers) or rounded (OSD pill, desktop cards),
# so no compositor blur, shadow or animation: a blur would cover the whole screen or show
# square corners.
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:^arctic-(frame|frame-reserve|launcher|popover|wallpapers|power|keys|polkit|osd|desktop)$
# Emoji, clipboard history (Super + Ctrl + E, Super + V) and the screen-share picker are popovers
# too. Clipboard history can hold passwords, so screenshots and screencasts show it blacked out.
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:^arctic-emoji$
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:^arctic-share$
layerrule=noblur:1,noshadow:1,noanim:1,shield_when_capture:1,layer_name:^arctic-clipboard$
# Fallback desktop (ARCTIC_SHELL=waybar): waybar flat, fuzzel ("launcher") zooms in.
layerrule=noshadow:1,noanim:1,layer_name:^waybar$
layerrule=animation_type_open:zoom,animation_type_close:fade,layer_name:^launcher$
# Wallpaper and screenshot selection must never blur, animate or cast shadows.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:^wallpaper$
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:^selection$

# ---- Windows are never blurred (look.conf turns blur on for the bar) -------
# Window rules only change what they set, so this first rule keeps applying. Mango matches a
# window without an app id as "broken", which .* matches too.
windowrule=noblur:1,appid:.*

# ---- Dialogs and small tools float, centred --------------------------------
windowrule=isfloating:1,appid:lxqt-policykit-agent
windowrule=isfloating:1,width:720,height:480,appid:org.pulseaudio.pavucontrol
windowrule=isfloating:1,width:720,height:520,appid:nm-connection-editor
windowrule=isfloating:1,width:560,height:480,appid:blueman-manager
windowrule=isfloating:1,title:^(Open File|Save File|Open Folder|Save As).*
windowrule=isfloating:1,isglobal:1,width:480,height:270,offsetx:90,offsety:85,title:^Picture-in-Picture$

# ---- Arctic apps -------------------------------------------------------
# The installer always takes the whole screen (design: installer screens are full-screen).
windowrule=isfullscreen:1,appid:org.arcticlinux.Installer
# Keyboard cheat sheet (Super+/)
windowrule=isfloating:1,width:640,height:560,appid:org.arcticlinux.Keys
# Settings (Super+S) floats, centred. Quickshell windows share one app id, so match the title.
# No width/height here: the window sizes itself to fit the screen (settings/shell.qml).
windowrule=isfloating:1,title:^Arctic Settings$
# The drop-down terminal (Super + Alt + Enter), sized by look.conf's scratchpad ratios.
windowrule=isnamedscratchpad:1,appid:^org\.arcticlinux\.Dropdown$
