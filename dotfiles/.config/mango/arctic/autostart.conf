# Arctic Linux — session autostart (runs once when Mango starts).
# On an installed system these may instead run as systemd user units shipped by
# arctic-desktop-config; each command below exits quietly if it is already running.
#
# `arctic-session shell` starts the Arctic shell (Quickshell): bar, screen frame, launcher,
# wallpapers, OSD, lock screen, polkit agent and the live-session welcome. With
# `env=ARCTIC_SHELL,waybar` in ~/.config/mango/user.conf it starts the fallback instead:
# waybar, fuzzel as the launcher and lxqt-policykit.

exec-once=arctic-theme apply
# Light or dark by the clock, when Settings > Appearance says so (does nothing otherwise).
exec-once=arctic-daylight apply
# A new wallpaper every so often, when Settings > Appearance says so (does nothing otherwise).
exec-once=arctic-wallpaper rotate apply
# What the Caps Lock and Num Lock lights say now, so their first change shows (arctic-osd).
exec-once=arctic-osd lock-keys --seed
exec-once=arctic-session effects
exec-once=arctic-session shell
exec-once=arctic-session mako
# nm-applet only starts with the fallback desktop (the shell has its own network menu).
exec-once=arctic-session nm-applet
exec-once=arctic-session clipboard
exec-once=arctic-session idle
exec-once=arctic-session screensaver
exec-once=arctic-session nightlight
exec-once=arctic-session drives
exec-once=arctic-session lid
exec-once=arctic-welcome
# Says once where shortcuts moved (0.3: the browser is Super + B) and which of your own an Arctic
# key now shadows; does nothing without the Settings app.
exec-once=arctic-settings --check-binds
# Your login hooks (arctic-hook), after everything above has started.
exec-once=arctic-hook login
