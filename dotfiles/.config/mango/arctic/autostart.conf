# Arctic Linux — session autostart (runs once when Mango starts).
# On an installed system these may instead run as systemd user units shipped by
# arctic-desktop-config; each command below exits quietly if it is already running.

exec-once=arctic-theme apply
exec-once=arctic-session waybar
exec-once=arctic-session mako
exec-once=arctic-session polkit
exec-once=arctic-session nm-applet
exec-once=arctic-session clipboard
exec-once=arctic-session idle
exec-once=arctic-welcome
