# Arctic Linux — foot (when picked instead of kitty). Spec: design components/Terminal.
# Colours: the active theme's term-* and ansi-* tokens, as in kitty.
[main]
include=~/.config/arctic/current/foot/colors.ini
font=JetBrains Mono:size=10.5
pad=10x12

[cursor]
style=block
blink=no

[bell]
urgent=yes
