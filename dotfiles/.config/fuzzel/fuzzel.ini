# Arctic Linux — launcher (Super+Space). Spec: design components/Launcher.
# 520px frosted card, radius-xl, selected row accent-soft, match highlight accent-text.
# Colours come from the active theme; arctic-theme swaps ~/.config/arctic/current.

[main]
include=~/.config/arctic/current/fuzzel-colors.ini
font=Figtree:size=11.5,Noto Sans:size=11.5
prompt="  "
placeholder=Search apps
icon-theme=hicolor
icons-enabled=yes
fields=filename,name,generic,keywords,categories
terminal=kitty -e
layer=overlay
anchor=top
y-margin=120
width=40
lines=6
horizontal-pad=16
vertical-pad=12
inner-pad=8
image-size-ratio=0.5
match-counter=yes
show-actions=no

[border]
width=1
radius=20

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
