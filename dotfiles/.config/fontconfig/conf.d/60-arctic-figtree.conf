<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Arctic Linux: the design's Figtree WOFF2 files name their family "Figtree Light" (with the
     right weights, 400–700). Asking for "Figtree" then still finds them; a correctly named
     Figtree, when installed, comes first. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Figtree</string></test>
    <edit name="family" mode="append" binding="strong"><string>Figtree Light</string></edit>
  </match>
</fontconfig>
