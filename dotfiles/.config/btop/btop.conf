#* Arctic Linux — btop starts with the Arctic theme: ~/.config/btop/themes/arctic.theme links to
#* the active theme's btop/arctic.theme (~/.config/arctic/current). btop fills in the rest of its
#* settings (and rewrites this file) the first time it exits.
color_theme = "arctic"

#* Keep the terminal's own background (kitty's term-background) behind btop.
theme_background = false

truecolor = true
