# Arctic Linux — kitty. Spec: design components/Terminal, guidelines/30-terminal-and-fetch.md.
# Palette: the active theme's term-* and ansi-* tokens (arctic-theme swaps it and reloads kitty).
include ../arctic/current/kitty.conf

# Type: JetBrains Mono 10.5pt, the terminal token (14px).
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font auto
font_size        10.5
disable_ligatures cursor

# Amber block cursor, no blink.
cursor_shape          block
cursor_blink_interval 0
cursor_trail          0

# 10 × 12 padding, no title bar (Mango draws the rounded 2px border).
window_padding_width  10 12
hide_window_decorations yes
confirm_os_window_close 0
placement_strategy    top-left

# Tabs match the bar: rounded, amber for the active one.
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    " {index}  {title} "
active_tab_font_style bold

# Calm by default.
enable_audio_bell     no
visual_bell_duration  0.0
window_alert_on_bell  yes
url_style             curly
copy_on_select        clipboard
strip_trailing_spaces smart
shell_integration     enabled
update_check_interval 0

# Your own tweaks go in user.conf (not overwritten by Arctic updates).
include user.conf
