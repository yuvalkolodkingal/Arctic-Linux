; Arctic Linux — qt6ct: how Qt 6 apps look (QT_QPA_PLATFORMTHEME=qt6ct, docs/BUILD-SPEC.md
; "App theming"). Fusion with the active theme's palette, which arctic-theme switches:
; color_scheme_path follows ~/.config/arctic/current. Change settings with the qt6ct app;
; it rewrites this file (keep color_scheme_path and custom_palette to follow the theme).
[Appearance]
color_scheme_path=~/.config/arctic/current/qt6ct/colors/arctic.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed="JetBrains Mono,10"
general="Figtree,11"

[Interface]
buttonbox_layout=3
menus_have_icons=true
show_shortcuts_in_context_menus=true
wheel_scroll_lines=3
