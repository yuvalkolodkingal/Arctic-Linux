# Arctic Linux — environment for systemd user services (so units find the arctic-* helpers).
# Apps started from the desktop get the same theming variables from Mango
# (~/.config/mango/arctic/look.conf: cursor_theme, cursor_size, env=QT_QPA_PLATFORMTHEME).
PATH=$HOME/.local/bin:$PATH
QT_QPA_PLATFORM=wayland;xcb
# Qt 5 and Qt 6 apps: colours, fonts and icons from qt5ct / qt6ct (both answer to "qt6ct"),
# file dialogs through the portal (standard_dialogs=xdgdesktopportal in their configs). The
# arctic-desktop-config package also sets it in /usr/lib/environment.d/50-arctic-qt.conf
# (read after this file), which older copies of this file don't have.
QT_QPA_PLATFORMTHEME=qt6ct
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
